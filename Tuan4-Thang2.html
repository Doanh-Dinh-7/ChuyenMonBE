def get_todos():

@app.route('/todos', methods=['POST'])
def create_todo():

                                        <div id="api-body-group" class="hidden">
                                            <label class="block text-xs text-stone-400 mb-1">Body (JSON)</label>
                                            <textarea id="api-body" class="w-full bg-stone-800 text-white text-sm p-2 rounded border border-stone-600 font-mono h-24">{ "title": "Học Flask" }</textarea>
                                        </div>
                                        <div id="api-id-group" class="hidden">
                                             <label class="block text-xs text-stone-400 mb-1">Todo ID</label>
                                             <input type="number" id="api-id" placeholder="1" class="w-full bg-stone-800 text-white text-sm p-2 rounded border border-stone-600">
                                        </div>
                                        <button onclick="sendApiRequest()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded transition">Gửi Request</button>
                                    </div>

                                    <!-- Response Panel -->
                                    <div class="lg:col-span-2 bg-stone-950 rounded p-4 font-mono text-xs text-green-400 border border-stone-800 h-64 overflow-y-auto relative">
                                        <div class="absolute top-2 right-2 text-stone-600 text-[10px]">Response Console</div>
                                        <pre id="api-response" class="whitespace-pre-wrap">Waiting for request...</pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `,
                    init: () => {
                        updateApiForm();
                        // Reset simulated DB for fresh view
                        simulatedDb = [
                            { id: 1, title: "Cài đặt môi trường Python", completed: true },
                            { id: 2, title: "Xem video bài giảng Day 1", completed: false }
                        ];
                    }
                }
            ]
        };

        let currentModuleIndex = 0;
        let simulatedDb = []; // Init in module init

        // --- INIT APP ---
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            loadModule(0);
        });

        // --- NAVIGATION LOGIC ---
        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = courseData.modules.map((mod, index) => `
                <a href="#" onclick="loadModule(${index})" 
                   class="nav-item group flex items-center px-6 py-3 text-sm font-medium text-stone-600 hover:bg-stone-50 hover:text-stone-900 transition-colors ${index === currentModuleIndex ? 'active' : ''}">
                    <span class="mr-3 h-6 w-6 flex items-center justify-center rounded-full border border-stone-300 text-xs ${index === currentModuleIndex ? 'bg-sky-500 border-sky-500 text-white' : 'group-hover:border-stone-400'}">
                        ${index + 1}
                    </span>
                    ${mod.title.split('. ')[1]}
                </a>
            `).join('');
            
            // Update Progress
            const progress = ((currentModuleIndex + 1) / courseData.modules.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${Math.round(progress)}% Hoàn thành`;
        }

        function loadModule(index) {
            currentModuleIndex = index;
            const mod = courseData.modules[index];
            
            // Update Header
            document.getElementById('page-title').innerText = mod.title;
            document.getElementById('page-subtitle').innerText = `${mod.subtitle} • Thời gian đọc: ${mod.readTime}`;
            
            // Update Content with animation
            const contentArea = document.getElementById('content-area');
            contentArea.classList.remove('fade-in');
            void contentArea.offsetWidth; // Trigger reflow
            contentArea.innerHTML = mod.content;
            contentArea.classList.add('fade-in');
            
            // Re-render Nav to update active state
            renderNav();
            
            // Scroll to top
            contentArea.scrollTop = 0;

            // Execute specific init scripts for this module
            if (mod.init) mod.init();
        }

        function toggleResources() {
            const modal = document.getElementById('resources-modal');
            modal.classList.toggle('hidden');
        }

        // --- MODULE 1: CHART LOGIC ---
        function initComparisonChart() {
            const ctx = document.getElementById('comparisonChart');
            if (!ctx) return;
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Độ phức tạp ban đầu', 'Tính linh hoạt', 'Quy mô code (Hello World)'],
                    datasets: [
                        {
                            label: 'Flask',
                            data: [2, 9, 2],
                            backgroundColor: 'rgba(14, 165, 233, 0.8)', // Sky 500
                            borderColor: 'rgb(14, 165, 233)',
                            borderWidth: 1
                        },
                        {
                            label: 'Django',
                            data: [8, 4, 8],
                            backgroundColor: 'rgba(16, 185, 129, 0.8)', // Emerald 500
                            borderColor: 'rgb(16, 185, 129)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 10,
                            title: { display: true, text: 'Thang điểm (1-10)' }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y + '/10';
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- MODULE 2: MVC INTERACTION ---
        function showMvcDetail(part) {
            const box = document.getElementById('mvc-explanation');
            const data = {
                'user': '<strong>User (Người dùng):</strong> Gửi yêu cầu HTTP (GET, POST...) thông qua trình duyệt hoặc API Client.',
                'controller': '<strong>Controller (Routes):</strong> Nhận yêu cầu, xử lý logic nghiệp vụ, gọi Model để lấy dữ liệu, và chọn View để trả về. Trong Flask, đây là các hàm được gắn decorator <code>@app.route</code>.',
                'model': '<strong>Model (Database):</strong> Đại diện cho cấu trúc dữ liệu. Tương tác trực tiếp với Database (SQL/NoSQL) để thêm, sửa, xóa, lấy dữ liệu.',
                'view': '<strong>View (Templates/JSON):</strong> Dữ liệu hiển thị cuối cùng trả về cho User. Có thể là trang HTML (render_template) hoặc chuỗi JSON (jsonify).'
            };
            box.innerHTML = data[part] || 'Chọn thành phần để xem chi tiết.';
            box.style.opacity = 0;
            setTimeout(() => { box.style.opacity = 1; }, 50);
        }

        function toggleStructure(type) {
            const basicBtn = document.getElementById('btn-basic');
            const advBtn = document.getElementById('btn-advanced');
            const content = document.getElementById('structure-content');
            
            if (type === 'basic') {
                basicBtn.className = "px-3 py-1 text-sm rounded bg-white shadow text-stone-800 font-medium";
                advBtn.className = "px-3 py-1 text-sm rounded text-stone-500 hover:text-stone-800";
                
                content.innerHTML = `
                     <pre class="code-preview p-4 rounded text-sm bg-stone-900 text-stone-100 overflow-x-auto">
my_project/
├── app.py          # Tất cả code ở đây
├── templates/
│   └── index.html
└── static/
    └── style.css
                    </pre>
                    <div class="p-4 bg-amber-50 rounded text-amber-800 text-sm">
                        <h5 class="font-bold">Đánh giá: Dành cho Demo</h5>
                        <p>Toàn bộ logic dồn vào 1 file <code>app.py</code>. Rất khó bảo trì khi dự án lớn lên.</p>
                    </div>
                `;
            } else {
                basicBtn.className = "px-3 py-1 text-sm rounded text-stone-500 hover:text-stone-800";
                advBtn.className = "px-3 py-1 text-sm rounded bg-white shadow text-stone-800 font-medium";
                
                content.innerHTML = `
                    <pre class="code-preview p-4 rounded text-sm bg-stone-900 text-stone-100 overflow-x-auto">
my_project/
├── run.py            # Entry point
├── config.py         # Configs
├── app/              # Package chính
│   ├── __init__.py   # Init Flask app
│   ├── routes.py     # Controller
│   ├── models.py     # Database models
│   └── templates/    # Views
└── requirements.txt
                    </pre>
                    <div class="p-4 bg-green-50 rounded text-green-800 text-sm">
                        <h5 class="font-bold">Đánh giá: Chuyên nghiệp</h5>
                        <p>Tách biệt rõ ràng các thành phần (Separation of Concerns). Dễ dàng mở rộng và làm việc nhóm.</p>
                    </div>
                `;
            }
        }

        // --- MODULE 4: API SIMULATOR ---
        function updateApiForm() {
            const method = document.getElementById('api-method').value;
            const bodyGroup = document.getElementById('api-body-group');
            const idGroup = document.getElementById('api-id-group');
            
            if (method === 'POST') {
                bodyGroup.classList.remove('hidden');
                idGroup.classList.add('hidden');
            } else if (method === 'DELETE') {
                bodyGroup.classList.add('hidden');
                idGroup.classList.remove('hidden');
            } else { // GET
                bodyGroup.classList.add('hidden');
                idGroup.classList.add('hidden');
            }
        }

        function sendApiRequest() {
            const method = document.getElementById('api-method').value;
            const output = document.getElementById('api-response');
            
            output.innerText = "Sending request...";
            
            // Simulate Network Delay
            setTimeout(() => {
                let response = {};
                let status = 200;
                let statusText = "OK";

                try {
                    if (method === 'GET') {
                        response = { success: true, count: simulatedDb.length, data: simulatedDb };
                    } 
                    else if (method === 'POST') {
                        const bodyRaw = document.getElementById('api-body').value;
                        const body = JSON.parse(bodyRaw);
                        if (!body.title) throw new Error("Missing 'title'");
                        
                        const newTodo = {
                            id: simulatedDb.length + 1,
                            title: body.title,
                            completed: false
                        };
                        simulatedDb.push(newTodo);
                        response = { success: true, data: newTodo };
                        status = 201; statusText = "Created";
                    } 
                    else if (method === 'DELETE') {
                        const id = parseInt(document.getElementById('api-id').value);
                        if (!id) throw new Error("Missing ID");
                        
                        const initialLen = simulatedDb.length;
                        simulatedDb = simulatedDb.filter(t => t.id !== id);
                        
                        if (simulatedDb.length === initialLen) {
                            status = 404; statusText = "Not Found";
                            response = { success: false, error: "ID không tồn tại" };
                        } else {
                            response = { success: true, message: `Deleted ID ${id}` };
                        }
                    }

                    // Format Output
                    output.innerHTML = `<span class="${status >= 400 ? 'text-red-400' : 'text-green-400'} font-bold">HTTP/1.1 ${status} ${statusText}</span>\n` + 
                                       JSON.stringify(response, null, 4);
                } catch (e) {
                    output.innerHTML = `<span class="text-amber-400 font-bold">HTTP/1.1 400 Bad Request</span>\n` + 
                                       JSON.stringify({ success: false, error: e.message || "Invalid JSON" }, null, 4);
                }
            }, 600);
        }
    </script>
</body>
</html>
