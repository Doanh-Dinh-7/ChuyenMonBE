                                <div class="bg-slate-800 p-6 rounded-xl shadow-sm text-white">
                                    <h3 class="text-xl font-bold mb-4">⚡ Quick Quiz</h3>
                                    <div id="quiz-area" class="space-y-6">
                                        <!-- Quiz content injected here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    `
                }
            ]
        };

        const quizQuestions = [
            {
                q: "1. Thư mục nào chứa các file CSS/JS?",
                options: ["templates", "static", "assets", "public"],
                correct: 1
            },
            {
                q: "2. Method nào dùng để xóa dữ liệu?",
                options: ["REMOVE", "CLEAR", "DELETE", "POST"],
                correct: 2
            },
            {
                q: "3. Jinja2 dùng ký tự nào để in biến?",
                options: ["{{ }}", "{% %}", "[[ ]]", "< >"],
                correct: 0
            }
        ];

        // --- Init Functions ---

        function initApp() {
            renderSidebar();
            renderMobileNav();
            loadModule(courseData.modules[0].id); // Load overview by default
            
            // Mobile menu toggle
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('hidden');
                sidebar.classList.toggle('absolute');
                sidebar.classList.toggle('z-50');
            });
        }

        function renderSidebar() {
            const container = document.getElementById('nav-container');
            container.innerHTML = courseData.modules.map(mod => `
                <button onclick="loadModule('${mod.id}')" 
                        class="nav-btn w-full text-left px-6 py-3 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors flex items-center" 
                        id="btn-${mod.id}">
                    <span class="mr-3 text-lg">${mod.icon}</span>
                    ${mod.title}
                </button>
            `).join('');
        }

        function renderMobileNav() {
             // Re-uses sidebar logic for simplicity in this SPA, 
             // but strictly styling adjustments handled via CSS classes toggled in initApp
        }

        function loadModule(moduleId) {
            // Update UI State
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${moduleId}`);
            if(activeBtn) activeBtn.classList.add('active');

            // Inject Content
            const module = courseData.modules.find(m => m.id === moduleId);
            document.getElementById('main-content').innerHTML = module.content;

            // Initialize specific dynamic elements based on module
            if (moduleId === 'overview') initOverviewCharts();
            if (moduleId === 'jinja2') initJinjaSim();
            if (moduleId === 'practice') initQuiz();

            // Mobile: close menu if open
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }
        }

        // --- Feature: Jinja2 Simulator ---
        function initJinjaSim() {
            const input = document.getElementById('jinja-data');
            if(!input) return;

            const update = () => {
                const output = document.getElementById('jinja-output');
                try {
                    const data = JSON.parse(input.value);
                    // Mock rendering logic
                    let html = `
                        <div class="border p-4 rounded bg-slate-50 shadow-sm max-w-sm">
                            <h3 class="text-xl font-bold text-slate-800">Xin chào, <span class="text-blue-600">${data.user || ''}</span></h3>
                            <p class="text-slate-600">Điểm số: <b>${data.score || 0}</b></p>
                            <div class="mt-2 pt-2 border-t border-slate-200">
                                ${data.is_admin 
                                    ? '<button class="bg-red-500 text-white px-3 py-1 rounded text-xs">Xóa User</button>' 
                                    : '<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs">User thường</span>'}
                            </div>
                        </div>
                    `;
                    output.innerHTML = html;
                } catch (e) {
                    output.innerHTML = `<span class="text-red-500 text-sm">Lỗi JSON: ${e.message}</span>`;
                }
            };
            
            input.addEventListener('input', update);
            update(); // Initial run
        }

        // --- Feature: Postman Simulator ---
        function runPostmanSim() {
            const method = document.getElementById('pm-method').value;
            const url = document.getElementById('pm-url').value;
            const bodyRaw = document.getElementById('pm-body').value;
            const responseBox = document.getElementById('pm-response');
            const statusBox = document.getElementById('pm-status');

            responseBox.innerHTML = '<span class="text-yellow-400 animate-pulse">Sending request...</span>';
            
            setTimeout(() => {
                let status = 200;
                let data = {};
                let statusText = "OK";
                let statusColor = "bg-green-200 text-green-800";

                try {
                    // Logic Simulation
                    if(method === "POST" || method === "PUT") {
                        const parsedBody = JSON.parse(bodyRaw || "{}");
                        if(!parsedBody.name && !parsedBody.username) {
                            status = 400;
                            statusText = "Bad Request";
                            statusColor = "bg-red-200 text-red-800";
                            data = { error: "Missing required fields (name/username)" };
                        } else {
                            status = 201;
                            statusText = "Created";
                            data = { success: true, id: Math.floor(Math.random() * 1000), ...parsedBody };
                        }
                    } else if (method === "DELETE") {
                        status = 204;
                        statusText = "No Content";
                        data = {}; // Empty body
                    } else {
                        // GET
                        data = [
                            { id: 1, name: "Alice", role: "Admin" },
                            { id: 2, name: "Bob", role: "User" }
                        ];
                    }
                } catch(e) {
                    status = 400;
                    statusText = "Invalid JSON";
                    statusColor = "bg-red-200 text-red-800";
                    data = { error: "JSON Body syntax error" };
                }

                // Update UI
                statusBox.className = `text-xs font-mono px-2 py-0.5 rounded ${statusColor}`;
                statusBox.innerText = `${status} ${statusText}`;
                
                const jsonStr = JSON.stringify(data, null, 2);
                // Syntax highlighting for JSON (simple)
                responseBox.innerHTML = `<pre>${jsonStr}</pre>`;

            }, 600);
        }

        // --- Feature: Quiz ---
        function initQuiz() {
            const container = document.getElementById('quiz-area');
            container.innerHTML = quizQuestions.map((q, idx) => `
                <div class="quiz-item">
                    <p class="font-bold text-sm mb-2">${q.q}</p>
                    <div class="space-y-1">
                        ${q.options.map((opt, optIdx) => `
                            <button onclick="checkAnswer(this, ${idx}, ${optIdx})" 
                                    class="w-full text-left text-sm px-3 py-2 rounded border border-slate-600 hover:bg-slate-700 transition-colors">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <p id="feedback-${idx}" class="text-xs mt-1 hidden"></p>
                </div>
            `).join('');
        }

        function checkAnswer(btn, qIdx, optIdx) {
            const isCorrect = quizQuestions[qIdx].correct === optIdx;
            const feedback = document.getElementById(`feedback-${qIdx}`);
            
            // Reset buttons in this group
            btn.parentElement.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-green-600', 'bg-red-600', 'border-transparent');
                b.classList.add('border-slate-600');
            });

            if(isCorrect) {
                btn.classList.add('bg-green-600', 'border-transparent');
                feedback.innerText = "Chính xác! 🎉";
                feedback.className = "text-xs mt-1 text-green-400 block";
            } else {
                btn.classList.add('bg-red-600', 'border-transparent');
                feedback.innerText = "Sai rồi, thử lại nhé.";
                feedback.className = "text-xs mt-1 text-red-400 block";
            }
        }

        // --- Charts ---
        function initOverviewCharts() {
            const ctx = document.getElementById('overviewChart');
            if (ctx) {
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Template Engine (SSR)', 'Single Page App (React/Vue)', 'Static Generator'],
                        datasets: [{
                            data: [30, 50, 20],
                            backgroundColor: ['#3b82f6', '#f59e0b', '#10b981'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }
        }

        // Start
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
