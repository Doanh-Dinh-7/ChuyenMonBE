<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Vietnamese:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans Vietnamese', sans-serif;
            background-color: #fdfbf7; /* Warm neutral background */
            color: #1f2937;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Code Block Styling */
        .code-block {
            background-color: #1e293b;
            color: #e2e8f0;
            font-family: 'Consolas', 'Monaco', monospace;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
        }
        .sql-keyword { color: #f472b6; font-weight: bold; } /* Pink-400 */
        .sql-string { color: #a3e635; } /* Lime-400 */
        .sql-func { color: #60a5fa; } /* Blue-400 */

        /* Chart Container Strict Styling */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
            }
        }

        /* Interactive Table Styling */
        .db-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .db-table th {
            background-color: #f1f5f9;
            font-weight: 600;
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .db-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            background-color: white;
        }
        .db-table tr:last-child td {
            border-bottom: none;
        }

        /* Connector Line Animation */
        .connector-line {
            transition: all 0.3s ease;
        }
        .connector-active {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            transform: scale(1.02);
        }

        .nav-item.active {
            background-color: #eff6ff;
            color: #2563eb;
            border-right: 3px solid #2563eb;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col md:flex-row">

    <!-- REQUIRED PLACEHOLDERS -->
    <!-- Chosen Palette: Warm Neutral Background (#fdfbf7) with Academic Blue (#2563eb), Slate text (#1f2937), and Code Dark Theme (#1e293b). Accents: Success Green, Warning Amber. -->
    
    <!-- Application Structure Plan: 
         Structure: A "Digital Syllabus" layout.
         - Left Sidebar: Navigation reflecting a 1-week curriculum (Intro, ERD, SQL, Practice).
         - Main Content Area: Dynamic container that swaps content based on selection.
         - Why: Students need a structured path. Grouping by "Module" allows for bite-sized learning (Theory -> Example -> Interactive Demo).
         - Key Interactions: 
           1. "SQL Playground": A simulated DB environment where users click buttons to run CRUD operations and see a JS-array-backed table update in real-time.
           2. "ERD Visualizer": Hover interaction to show relationships between Primary Keys and Foreign Keys.
           3. "Quiz Mode": Simple validation logic for learning checks.
    -->

    <!-- Visualization & Content Choices:
         1. Intro: Chart.js Bar Chart showing "Most Popular Databases 2024" (Source: Stack Overflow Survey). Goal: Motivate students by showing market relevance. 
            - Method: Chart.js (Canvas).
         2. ERD: HTML/CSS Tables with hover listeners. Goal: Explain PK/FK visually.
            - Method: DOM manipulation (addClass/removeClass). No SVG.
         3. SQL Simulator: JS Arrays rendered as HTML tables. Goal: Teach CRUD without a backend.
            - Method: Vanilla JS logic simulating a DB engine.
         4. Content: Text formatted with Tailwind typography. Code blocks styled for readability.
    -->

    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

            lab: {
                title: "Chương 4: Bài Tập Cuối Khóa",
                description: "Áp dụng kiến thức để thiết kế hệ thống bán hàng đơn giản.",
                content: `
                    <div class="space-y-8 animate-fade-in">
                        <!-- Problem Statement -->
                        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-100">
                            <div class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mb-4">Project Mini</div>
                            <h2 class="text-2xl font-bold text-slate-800 mb-4">Đề bài: Hệ thống User & Product</h2>
                            <p class="text-slate-600 mb-4">Một khách hàng muốn xây dựng ứng dụng thương mại điện tử đơn giản. Họ cần lưu trữ thông tin:</p>
                            <ul class="list-disc list-inside text-slate-600 space-y-2 mb-6 ml-4">
                                <li><strong>Users:</strong> Tên, email, mật khẩu, địa chỉ.</li>
                                <li><strong>Products:</strong> Tên sản phẩm, giá, mô tả, số lượng kho.</li>
                                <li><strong>Yêu cầu:</strong> Thiết kế Database để lưu trữ 2 đối tượng trên. (Chưa cần làm phần Đơn hàng để đơn giản hóa).</li>
                            </ul>
                            
                            <h3 class="font-bold text-slate-800 mb-3">Nhiệm vụ của bạn:</h3>
                            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm space-y-2">
                                <p>1. Vẽ ERD cho 2 bảng trên (xác định tên cột, kiểu dữ liệu, khóa chính).</p>
                                <p>2. Viết câu lệnh SQL để tạo bảng (CREATE TABLE).</p>
                                <p>3. Viết 5 câu lệnh INSERT để thêm dữ liệu mẫu.</p>
                                <p>4. Viết câu lệnh tìm sản phẩm có giá > 100.000đ.</p>
                            </div>
                        </div>

                        <!-- Solution Accordion -->
                        <div class="border border-slate-200 rounded-xl bg-white overflow-hidden">
                            <button onclick="toggleSolution()" class="w-full flex justify-between items-center p-6 bg-slate-50 hover:bg-slate-100 transition-colors">
                                <span class="font-bold text-slate-700">Xem Gợi Ý & Đáp Án Mẫu</span>
                                <span id="arrow-icon" class="text-slate-400 transform transition-transform duration-300">&#9660;</span>
                            </button>
                            
                            <div id="solution-content" class="hidden p-6 border-t border-slate-200 bg-slate-50">
                                
                                <!-- Part 1: ERD Design -->
                                <div class="mb-8">
                                    <h4 class="font-bold text-blue-700 mb-2">1. Thiết Kế Bảng (Schema)</h4>
                                    <div class="grid md:grid-cols-2 gap-4">
                                        <div class="bg-white p-4 border border-slate-200 rounded shadow-sm">
                                            <div class="font-bold text-center border-b pb-2 mb-2">Table: users</div>
                                            <div class="text-xs font-mono space-y-1">
                                                <div class="flex justify-between"><span class="font-bold">id</span> <span class="text-slate-500">INT (PK, AI)</span></div>
                                                <div class="flex justify-between"><span>full_name</span> <span class="text-slate-500">VARCHAR(100)</span></div>
                                                <div class="flex justify-between"><span>email</span> <span class="text-slate-500">VARCHAR(100)</span></div>
                                            </div>
                                        </div>
                                        <div class="bg-white p-4 border border-slate-200 rounded shadow-sm">
                                            <div class="font-bold text-center border-b pb-2 mb-2">Table: products</div>
                                            <div class="text-xs font-mono space-y-1">
                                                <div class="flex justify-between"><span class="font-bold">id</span> <span class="text-slate-500">INT (PK, AI)</span></div>
                                                <div class="flex justify-between"><span>name</span> <span class="text-slate-500">VARCHAR(200)</span></div>
                                                <div class="flex justify-between"><span>price</span> <span class="text-slate-500">DECIMAL(10,2)</span></div>
                                                <div class="flex justify-between"><span>stock</span> <span class="text-slate-500">INT</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Part 2: SQL Code -->
                                <div>
                                    <h4 class="font-bold text-blue-700 mb-2">2. Mã Nguồn SQL (Postgres/MySQL)</h4>
                                    <div class="code-block text-sm">
<span class="text-slate-400">-- 1. Tạo bảng Users</span>
<span class="sql-keyword">CREATE TABLE</span> users (
    id <span class="sql-keyword">INT PRIMARY KEY AUTO_INCREMENT</span>,
    full_name <span class="sql-keyword">VARCHAR</span>(100) <span class="sql-keyword">NOT NULL</span>,
    email <span class="sql-keyword">VARCHAR</span>(100) <span class="sql-keyword">UNIQUE</span>
);

<span class="text-slate-400">-- 2. Tạo bảng Products</span>
<span class="sql-keyword">CREATE TABLE</span> products (
    id <span class="sql-keyword">INT PRIMARY KEY AUTO_INCREMENT</span>,
    name <span class="sql-keyword">VARCHAR</span>(200) <span class="sql-keyword">NOT NULL</span>,
    price <span class="sql-keyword">DECIMAL</span>(10,2) <span class="sql-keyword">DEFAULT</span> 0,
    stock <span class="sql-keyword">INT</span>
);

<span class="text-slate-400">-- 3. Thêm dữ liệu</span>
<span class="sql-keyword">INSERT INTO</span> products (name, price, stock) 
<span class="sql-keyword">VALUES</span> (<span class="sql-string">'Laptop Dell'</span>, 15000000, 10),
       (<span class="sql-string">'Chuột Logitech'</span>, 250000, 50);

<span class="text-slate-400">-- 4. Tìm kiếm</span>
<span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> products <span class="sql-keyword">WHERE</span> price > 100000;
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Mistakes to Avoid -->
                        <div class="bg-red-50 p-6 rounded-xl border border-red-100 mt-6">
                            <h3 class="text-lg font-bold text-red-800 mb-2">&#9888; Lỗi Thường Gặp Của Newbie</h3>
                            <ul class="list-disc list-inside text-red-700 text-sm space-y-1">
                                <li>Đặt tên bảng/cột có dấu tiếng Việt hoặc khoảng trắng (Sai: <code>Tên Khách Hàng</code> -> Đúng: <code>ten_khach_hang</code>).</li>
                                <li>Quên khóa chính (Primary Key) -> Dẫn đến dữ liệu trùng lặp không kiểm soát.</li>
                                <li>Lưu sai kiểu dữ liệu (Ví dụ: Lưu giá tiền bằng VARCHAR thay vì DECIMAL/INT).</li>
                            </ul>
                        </div>
                    </div>
                `
            }
        };

        // --- Core Functions ---

        function init() {
            // Load initial module
            loadModule('intro');
            
            // Render Chart for Intro (Wait for DOM update)
            setTimeout(() => {
                renderIntroChart();
            }, 100);

            // Mobile menu listener
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('hidden');
                sidebar.classList.toggle('fixed');
                sidebar.classList.toggle('z-50');
            });
        }

        function loadModule(moduleId) {
            // Update State
            appState.currentModule = moduleId;
            
            // Update Sidebar UI
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.dataset.module === moduleId) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // Update Progress Bar (Mock Logic)
            let progress = 0;
            if(moduleId === 'intro') progress = 25;
            if(moduleId === 'erd') progress = 50;
            if(moduleId === 'sql') progress = 75;
            if(moduleId === 'lab') progress = 100;
            updateProgress(progress);

            // Inject Content
            const container = document.getElementById('main-content');
            const data = modules[moduleId];
            
            container.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <header class="mb-8">
                        <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2">${data.title}</h1>
                        <p class="text-lg text-slate-500">${data.description}</p>
                    </header>
                    ${data.content}
                </div>
            `;

            // Re-initialize specific scripts if needed based on module
            if (moduleId === 'intro') {
                setTimeout(renderIntroChart, 50);
            }
            if (moduleId === 'sql') {
                setTimeout(renderSQLTable, 50);
            }
            // Close mobile menu if open
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }
        }

        function updateProgress(percent) {
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        // --- Intro Chart Logic ---
        function renderIntroChart() {
            const ctx = document.getElementById('dbChart');
            if (!ctx) return;
            
            // Destroy existing if any to prevent canvas reuse error
            if (window.myChart instanceof Chart) {
                window.myChart.destroy();
            }

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['PostgreSQL', 'MySQL', 'SQLite', 'Microsoft SQL', 'MongoDB'],
                    datasets: [{
                        label: '% Professional Developers Using',
                        data: [49, 40, 28, 26, 25],
                        backgroundColor: [
                            'rgba(59, 130, 246, 0.7)', // Blue
                            'rgba(245, 158, 11, 0.7)', // Amber
                            'rgba(100, 116, 139, 0.7)', // Slate
                            'rgba(239, 68, 68, 0.7)',  // Red
                            'rgba(16, 185, 129, 0.7)'  // Green
                        ],
                        borderColor: [
                            'rgb(59, 130, 246)',
                            'rgb(245, 158, 11)',
                            'rgb(100, 116, 139)',
                            'rgb(239, 68, 68)',
                            'rgb(16, 185, 129)'
                        ],
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { display: false }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.raw + '% Developers';
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- ERD Interaction Logic ---
        function highlightRelation(userId) {
            // Find all order rows related to this user
            const orders = document.querySelectorAll(`.user-${userId}`);
            orders.forEach(el => {
                el.classList.add('connector-active');
            });
        }

        function resetRelation() {
            const orders = document.querySelectorAll('.order-row');
            orders.forEach(el => {
                el.classList.remove('connector-active');
            });
        }

        // --- SQL Simulator Logic ---
        function renderSQLTable() {
            const tbody = document.getElementById('result-body');
            if(!tbody) return;

            tbody.innerHTML = '';
            appState.simulatedDB.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><span class="px-2 py-1 bg-slate-100 text-xs rounded text-slate-600">${user.role}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function simulateSQL(type) {
            const log = document.getElementById('sql-log');
            
            if (type === 'SELECT') {
                log.innerHTML = `<span class="sql-keyword">SELECT</span> * <span class="sql-keyword">FROM</span> users; <br> <span class="text-slate-500">-> Đã lấy ${appState.simulatedDB.length} bản ghi.</span>`;
                renderSQLTable(); // Just refresh
            } 
            else if (type === 'INSERT') {
                const newId = appState.simulatedDB.length + 1;
                const newUser = { id: newId, name: `New User ${newId}`, email: `user${newId}@test.com`, role: 'User' };
                appState.simulatedDB.push(newUser);
                log.innerHTML = `<span class="sql-keyword">INSERT INTO</span> users <span class="sql-keyword">VALUES</span> (${newId}, ...); <br> <span class="text-green-400">-> Đã thêm bản ghi ID ${newId}.</span>`;
                renderSQLTable();
            } 
            else if (type === 'UPDATE') {
                if (appState.simulatedDB.length > 0) {
                    appState.simulatedDB[0].name = "Updated Name " + Math.floor(Math.random() * 100);
                    log.innerHTML = `<span class="sql-keyword">UPDATE</span> users <span class="sql-keyword">SET</span> name = '...' <span class="sql-keyword">WHERE</span> id=1; <br> <span class="text-yellow-400">-> Đã cập nhật ID 1.</span>`;
                    renderSQLTable();
                } else {
                    log.innerHTML = `<span class="text-red-400">Error: Bảng trống, không thể Update.</span>`;
                }
            } 
            else if (type === 'DELETE') {
                if (appState.simulatedDB.length > 0) {
                    const removed = appState.simulatedDB.pop();
                    log.innerHTML = `<span class="sql-keyword">DELETE FROM</span> users <span class="sql-keyword">WHERE</span> id=${removed.id}; <br> <span class="text-red-400">-> Đã xóa bản ghi cuối cùng.</span>`;
                    renderSQLTable();
                } else {
                    log.innerHTML = `<span class="text-red-400">Error: Bảng trống, không thể Delete.</span>`;
                }
            }
        }

        function resetSim() {
            appState.simulatedDB = [
                { id: 1, name: 'Nguyễn Văn A', email: 'vana@gmail.com', role: 'User' },
                { id: 2, name: 'Trần Thị B', email: 'thib@gmail.com', role: 'Admin' },
                { id: 3, name: 'Lê Văn C', email: 'vanc@gmail.com', role: 'User' }
            ];
            renderSQLTable();
            document.getElementById('sql-log').innerHTML = '-- Data Reset.';
        }

        // --- Lab Logic ---
        function toggleSolution() {
            const content = document.getElementById('solution-content');
            const arrow = document.getElementById('arrow-icon');
            
            content.classList.toggle('hidden');
            if (!content.classList.contains('hidden')) {
                arrow.style.transform = 'rotate(180deg)';
            } else {
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
