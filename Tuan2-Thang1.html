<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Nâng Cao & OOP Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Chosen Palette: Indigo & Emerald (Professional, Deep Learning feel) -->
    <!-- Application Structure Plan: 
         - Layout: Sidebar Navigation (Left) + Dynamic Content Area (Right).
         - Navigation: Divided into 5 Days/Modules corresponding to the user's request.
         - Content Strategy: Each module follows a structure: 
           1. Concept (Theory with Real-world Analogies).
           2. Visuals (Charts/Diagrams for Abstract Concepts).
           3. Code Lab (Interactive Editor Simulation).
           4. Pro/Cons & Best Practices.
         - Final Project: A fully functional "Student Management System" simulation within the browser to demonstrate CRUD.
         - Interaction: Users click through modules, run code snippets, and interact with the CRUD system.
    -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap');

        body { font-family: 'Roboto', sans-serif; }
        .code-font { font-family: 'Source Code Pro', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #c7cddb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* Chart Container Strict Styling */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 300px;
            max-height: 400px;
        }

        /* Syntax Highlighting */
        .py-keyword { color: #c678dd; font-weight: bold; } /* def, class, return */
        .py-func { color: #61afef; } /* function names */
        .py-string { color: #98c379; } /* strings */
        .py-comment { color: #7f848e; font-style: italic; } /* comments */
        .py-class { color: #e5c07b; font-weight: bold; } /* class names */
        .py-number { color: #d19a66; } /* numbers */
        .py-self { color: #e06c75; font-style: italic; } /* self */

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Inheritance Tree Visualization Styles */
        .tree-node {
            border: 2px solid #e5e7eb;
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            width: 120px;
            position: relative;
            transition: all 0.3s;
        }
        .tree-node:hover { border-color: #4f46e5; transform: scale(1.05); }
        .tree-line {
            width: 2px;
            background: #cbd5e1;
            position: absolute;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl flex-shrink-0 z-20 transition-transform duration-300 transform md:translate-x-0 -translate-x-full absolute md:relative h-full" id="sidebar">
        <div class="p-6 border-b border-slate-700 bg-slate-950">
            <div class="flex items-center gap-3">
                <i class="fa-brands fa-python text-3xl text-yellow-400"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Python Master</h1>
                    <p class="text-xs text-slate-400">OOP & Advanced</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <div id="nav-container">
                <!-- Nav Items injected by JS -->
            </div>
        </nav>

        <div class="p-4 bg-slate-800 border-t border-slate-700">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
                <span>Tiến độ</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-slate-700 h-1.5 rounded-full">
                <div id="progress-bar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen relative w-full">
        <!-- Mobile Header -->
        <header class="md:hidden bg-white border-b border-gray-200 p-4 flex justify-between items-center z-10">
            <span class="font-bold text-slate-800">Python OOP</span>
            <button id="menu-btn" class="text-slate-600 focus:outline-none">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </header>

        <!-- Content Scroll Area -->
        <div id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth bg-gray-50">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden md:hidden"></div>

    <!-- Visualization & Content Choices:
         - Methodology: Used a 'concept-first' approach. Charts (Chart.js) visualize the 'Why' (e.g., Maintainability vs Time).
         - Inheritance: Visualized using CSS-styled blocks connected by lines (DOM elements) instead of SVG/Mermaid to comply with strict no-SVG rules.
         - Code Interaction: Built a simulated 'Run' environment. The output is pre-calculated but presented dynamically to give the feel of a live interpreter.
         - Project: The CRUD exercise is fully interactive. It uses a JS array as a mock database so students can see the results of their 'code' logic immediately.
    -->

    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <script>
        // --- Course Content Data ---
        const courseData = {

                        </div>
                    </div>
                `
            },
            day1: {
                id: 'day1',
                title: 'Class & Object',
                icon: 'fa-solid fa-cube',
                intro: 'Bắt đầu hành trình OOP bằng việc hiểu hai khái niệm cốt lõi: <strong>Class</strong> (Lớp) và <strong>Object</strong> (Đối tượng). Hãy tưởng tượng Class là bản thiết kế, còn Object là sản phẩm thực tế.',
                sections: [
                    {
                        title: "1. Khái niệm cơ bản",
                        theory: `
                            <ul class="list-disc pl-5 space-y-2 text-gray-700">
                                <li><strong>Class (Lớp):</strong> Là một khuôn mẫu (blueprint) định nghĩa các thuộc tính (attribute) và hành vi (method) chung. Ví dụ: Bản vẽ thiết kế xe hơi.</li>
                                <li><strong>Object (Đối tượng):</strong> Là một thực thể cụ thể được tạo ra từ Class. Ví dụ: Chiếc xe VinFast VF8 màu đỏ (cụ thể).</li>
                                <li><strong>__init__:</strong> Hàm khởi tạo (Constructor), chạy ngay khi tạo đối tượng, dùng để thiết lập giá trị ban đầu.</li>
                                <li><strong>self:</strong> Tham chiếu đến chính đối tượng đang được thao tác (giống 'this' trong Java/C++).</li>
                            </ul>
                        `,
                        code: `
<span class="py-keyword">class</span> <span class="py-class">SinhVien</span>:
    <span class="py-comment"># Hàm khởi tạo</span>
    <span class="py-keyword">def</span> <span class="py-func">__init__</span>(<span class="py-self">self</span>, ten, nam_sinh):
        <span class="py-self">self</span>.ten = ten          <span class="py-comment"># Thuộc tính (Attribute)</span>
        <span class="py-self">self</span>.nam_sinh = nam_sinh

    <span class="py-comment"># Phương thức (Method)</span>
    <span class="py-keyword">def</span> <span class="py-func">gioi_thieu</span>(<span class="py-self">self</span>):
        tuoi = <span class="py-number">2025</span> - <span class="py-self">self</span>.nam_sinh

<span class="py-comment"># Tạo Object (Instantiation)</span>
sv1 = SinhVien(<span class="py-string">"An"</span>, <span class="py-number">2003</span>)
sv2 = SinhVien(<span class="py-string">"Bình"</span>, <span class="py-number">2004</span>)

<span class="py-func">print</span>(sv1.gioi_thieu())
<span class="py-func">print</span>(sv2.gioi_thieu())
`,

                        visType: 'comparison', // Custom flag for rendering comparison table
                        tableData: {
                            head: ['Tiêu chí', 'Lập trình thủ tục', 'OOP (Hướng đối tượng)'],
                            rows: [
                                ['Dữ liệu', 'Rời rạc, khó quản lý', 'Đóng gói trong Object'],
                                ['Tái sử dụng', 'Copy-paste code hàm', 'Kế thừa (Inheritance)'],
                                ['Bảo mật', 'Khó kiểm soát truy cập', 'Encapsulation (Private/Public)']
                            ]
                        }
                    }
                ]
            },
            day3: {
                id: 'day3',
                title: 'Kế Thừa & Đa Hình',
                icon: 'fa-solid fa-sitemap',
                intro: 'Kỹ thuật mạnh mẽ nhất của OOP. <strong>Kế thừa</strong> giúp bạn không lặp lại code, và <strong>Đa hình</strong> giúp code linh hoạt xử lý nhiều loại đối tượng khác nhau.',

                        theory: "Cho phép tạo class mới (Con) dựa trên class đã có (Cha). Class con hưởng mọi thuộc tính/method của cha và có thể mở rộng thêm.",

`,

                    {

            }

        // --- Core Logic ---

        let currentModule = 'intro';

        function init() {
            renderNav();
            loadModule('intro');
            
            // Mobile Menu
            const btn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            function toggleMenu() {
                const isClosed = sidebar.classList.contains('-translate-x-full');
                if (isClosed) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }

            btn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }

        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            
            Object.values(courseData).forEach(mod => {
                const isActive = mod.id === currentModule;
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-all mb-1 ${isActive ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
                div.onclick = () => loadModule(mod.id);
                div.innerHTML = `
                    <i class="${mod.icon} w-5 text-center"></i>
                    <span class="font-medium text-sm">${mod.title}</span>
                `;
                container.appendChild(div);
            });
        }

        function loadModule(id) {
            currentModule = id;
            renderNav();
            updateProgress();
            
            const contentDiv = document.getElementById('main-content');
            const mod = courseData[id];

            // 1. Header with Intro
            let html = `
                <div class="mb-8 fade-in">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                            <i class="${mod.icon} text-2xl"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">${mod.title}</h2>
                    </div>
                    ${mod.intro ? `<p class="text-slate-600 border-l-4 border-indigo-400 pl-4 py-1 bg-white shadow-sm rounded-r">${mod.intro}</p>` : ''}
                </div>
            `;

            // 2. Dashboard Specific
            if (id === 'intro') {
                html = mod.content;
                contentDiv.innerHTML = html;
                setTimeout(renderComplexityChart, 100);
                return;
            }

            // 3. Project Specific
            if (mod.isProject) {
                renderProject(contentDiv);
                return;
            }

            // 4. Standard Modules
            mod.sections.forEach(sec => {
                html += `
                    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8 fade-in">
                        <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <span class="w-2 h-6 bg-indigo-500 rounded-full"></span>
                            ${sec.title}
                        </h3>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <!-- Theory -->
                            <div>
                                <div class="prose prose-slate text-sm mb-4">
                                    ${sec.theory}
                                </div>
                                ${sec.visType === 'comparison' ? renderComparisonTable(sec.tableData) : ''}
                                ${sec.visType === 'tree' ? renderTreeViz() : ''}
                                ${sec.visType === 'chart_error' ? '<div class="chart-container"><canvas id="errorChart"></canvas></div>' : ''}
                                ${sec.realWorld ? `
                                    <div class="mt-4 p-3 bg-emerald-50 rounded border border-emerald-100">
                                        <p class="text-xs font-bold text-emerald-700 uppercase mb-1">Thực tế</p>
                                        <p class="text-sm text-emerald-800">${sec.realWorld}</p>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Code Lab -->
                            <div class="flex flex-col h-full">
                                <div class="bg-slate-900 rounded-t-lg p-3 flex justify-between items-center border-b border-slate-700">
                                    <span class="text-xs text-slate-400 font-mono">example.py</span>
                                    <span class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">Read-Only</span>
                                </div>
                                <div class="bg-slate-900 p-4 overflow-x-auto text-sm code-font leading-relaxed flex-1">
                                    ${sec.code}
                                </div>
                                <div class="bg-slate-950 p-3 rounded-b-lg border-t border-slate-800 flex flex-col gap-2">
                                    <button onclick="this.nextElementSibling.classList.remove('hidden')" class="self-start px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold uppercase rounded transition-colors shadow-lg shadow-indigo-500/30">
                                        <i class="fas fa-play mr-1"></i> Chạy thử
                                    </button>
                                    <div class="hidden mt-2 p-3 bg-black text-green-400 font-mono text-xs rounded border-l-2 border-green-500">
                                        <div class="text-gray-500 mb-1"># Terminal Output:</div>
                                        ${sec.output}
                                    </div>
                                </div>
                                ${sec.note ? `<p class="mt-2 text-xs text-slate-500 italic text-center">${sec.note}</p>` : ''}
                            </div>
                        </div>
                    </section>
                `;
            });

            contentDiv.innerHTML = html;

            // Render Error Chart if needed
            if (id === 'day4') {
                setTimeout(renderErrorChart, 100);
            }
        }

        // --- Helper Renderers ---

        function renderComparisonTable(data) {
            return `
                <div class="overflow-x-auto mt-4 rounded-lg border border-slate-200">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-100 text-slate-700 font-bold">
                            <tr>
                                ${data.head.map(h => `<th class="px-4 py-2">${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${data.rows.map(row => `
                                <tr class="bg-white hover:bg-slate-50">
                                    <td class="px-4 py-2 font-medium text-slate-900">${row[0]}</td>
                                    <td class="px-4 py-2 text-red-600">${row[1]}</td>
                                    <td class="px-4 py-2 text-green-600 font-medium">${row[2]}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderTreeViz() {
            return `
                <div class="mt-6 flex flex-col items-center justify-center p-6 bg-slate-50 rounded border border-slate-200 h-48">
                    <div class="tree-node bg-indigo-100 text-indigo-800 font-bold mb-6">DongVat</div>
                    <div class="relative w-40 h-6">
                        <div class="tree-line h-6 left-1/2 -translate-x-1/2 -top-6"></div> <!-- Vertical from Parent -->
                        <div class="tree-line w-full h-0.5 bg-slate-300 top-0"></div> <!-- Horizontal -->
                        <div class="tree-line h-4 left-0 top-0 bg-slate-300"></div> <!-- Left Connector -->
                        <div class="tree-line h-4 right-0 top-0 bg-slate-300"></div> <!-- Right Connector -->
                    </div>
                    <div class="flex gap-8">
                        <div class="tree-node">Cho</div>
                        <div class="tree-node">Meo</div>
                    </div>
                    <p class="text-xs text-center mt-4 text-slate-400">Sơ đồ kế thừa đơn giản</p>
                </div>
            `;
        }

        // --- Project Logic (CRUD) ---
        
        // Mock DB
        let students = [
            { id: 1, name: 'Nguyễn Văn A', age: 20, gpa: 3.5 },
            { id: 2, name: 'Trần Thị B', age: 19, gpa: 3.8 }
        ];

        function renderProject(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 fade-in h-full">
                    <!-- Control Panel (Simulating Code/Form) -->
                    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                        <h3 class="font-bold text-lg mb-4 text-slate-800">Quản Lý Sinh Viên</h3>
                        <p class="text-xs text-slate-500 mb-6">Nhập thông tin và chọn hành động. Hệ thống sẽ mô phỏng việc gọi Class <code>StudentManager</code>.</p>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Họ và Tên</label>
                                <input type="text" id="p_name" class="w-full p-2 border border-slate-300 rounded text-sm focus:border-indigo-500 outline-none" placeholder="VD: Lê Văn C">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Tuổi</label>
                                    <input type="number" id="p_age" class="w-full p-2 border border-slate-300 rounded text-sm focus:border-indigo-500 outline-none" placeholder="20">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">GPA</label>
                                    <input type="number" step="0.1" id="p_gpa" class="w-full p-2 border border-slate-300 rounded text-sm focus:border-indigo-500 outline-none" placeholder="3.5">
                                </div>
                            </div>
                            
                            <div class="pt-4 border-t border-slate-100 flex flex-col gap-2">
                                <button onclick="addStudent()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-sm font-bold transition-colors">
                                    <i class="fas fa-plus mr-1"></i> Thêm Sinh Viên (Create)
                                </button>
                                <button onclick="resetData()" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded text-sm font-bold transition-colors">
                                    <i class="fas fa-rotate-right mr-1"></i> Reset Data
                                </button>
                            </div>

                            <div class="mt-4 p-3 bg-yellow-50 rounded border border-yellow-200 text-xs text-yellow-800">
                                <i class="fas fa-file-code mr-1"></i>
                                Mô phỏng ghi file: Khi thao tác, dữ liệu được cập nhật vào RAM. Bấm "Xuất File" để tải JSON.
                            </div>
                        </div>
                    </div>

                    <!-- Display Panel (Simulating Output/File Content) -->
                    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg text-slate-800">Danh Sách (Database/File)</h3>
                            <button onclick="exportData()" class="text-sm text-indigo-600 font-medium hover:underline">
                                <i class="fas fa-download"></i> Xuất JSON
                            </button>
                        </div>
                        
                        <div class="flex-1 overflow-auto border border-slate-200 rounded-lg">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50 text-slate-600 font-bold sticky top-0">
                                    <tr>
                                        <th class="p-3 border-b">ID</th>
                                        <th class="p-3 border-b">Tên</th>
                                        <th class="p-3 border-b">Tuổi</th>
                                        <th class="p-3 border-b">GPA</th>
                                        <th class="p-3 border-b text-right">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="student-table-body" class="divide-y divide-slate-100">
                                    <!-- Rows generated JS -->
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-2 text-xs text-slate-400 text-right" id="student-count">Loading...</div>
                    </div>
                </div>
            `;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('student-table-body');
            const count = document.getElementById('student-count');
            if (!tbody) return;

            tbody.innerHTML = students.map(s => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-3 font-mono text-xs text-slate-500">#${s.id}</td>
                    <td class="p-3 font-medium text-slate-800">${s.name}</td>
                    <td class="p-3 text-slate-600">${s.age}</td>
                    <td class="p-3 font-bold ${s.gpa >= 3.2 ? 'text-green-600' : 'text-amber-600'}">${s.gpa}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteStudent(${s.id})" class="text-red-400 hover:text-red-600 transition-colors">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            
            count.innerText = `Tổng số: ${students.length} sinh viên`;
        }

        function addStudent() {
            const name = document.getElementById('p_name').value;
            const age = document.getElementById('p_age').value;
            const gpa = document.getElementById('p_gpa').value;

            if (!name || !age || !gpa) {
                alert("Vui lòng nhập đủ thông tin!"); // Simple alert for this context
                return;
            }

            const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
            students.push({
                id: newId,
                name: name,
                age: parseInt(age),
                gpa: parseFloat(gpa)
            });
            
            // Clear inputs
            document.getElementById('p_name').value = '';
            document.getElementById('p_age').value = '';
            document.getElementById('p_gpa').value = '';
            
            renderTable();
        }

        function deleteStudent(id) {
            if (confirm('Xóa sinh viên này?')) {
                students = students.filter(s => s.id !== id);
                renderTable();
            }
        }

        function resetData() {
            students = [
                { id: 1, name: 'Nguyễn Văn A', age: 20, gpa: 3.5 },
                { id: 2, name: 'Trần Thị B', age: 19, gpa: 3.8 }
            ];
            renderTable();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(students, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "students.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // --- Charts ---

        function updateProgress() {
            const keys = Object.keys(courseData);
            const index = keys.indexOf(currentModule);
            const percent = Math.round(((index + 1) / keys.length) * 100);
            
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
        }

        function renderComplexityChart() {
            const ctx = document.getElementById('complexityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Start', 'Month 1', 'Month 3', 'Month 6', 'Year 1'],
                    datasets: [{
                        label: 'OOP (Hướng đối tượng)',
                        data: [10, 20, 30, 35, 40], // Complexity grows slowly
                        borderColor: 'rgb(79, 70, 229)', // Indigo
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        tension: 0.4,
                        fill: true
                    }, {
                        label: 'Procedural (Thủ tục)',
                        data: [5, 25, 60, 85, 95], // Complexity skyrockets
                        borderColor: 'rgb(244, 63, 94)', // Rose
                        borderDash: [5, 5],
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { title: { display: true, text: 'Độ khó bảo trì' } }
                    }
                }
            });
        }

        function renderErrorChart() {
            const ctx = document.getElementById('errorChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Syntax Error (Cú pháp)', 'Runtime Error (Khi chạy)', 'Logical Error (Logic)'],
                    datasets: [{
                        data: [15, 60, 25],
                        backgroundColor: [
                            '#fbbf24', // Amber
                            '#ef4444', // Red (Most dangerous)
                            '#3b82f6'  // Blue
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' },
                        title: { display: true, text: 'Các loại lỗi thường gặp' }
                    }
                }
            });
        }

        // Init App
        init();

    </script>
</body>
</html>
