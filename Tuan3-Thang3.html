                content: `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8 fade-in">

                            <li>Tạo script seed.py để thêm 10 sinh viên mẫu vào database.</li>
                            <li>Viết query tìm tất cả sinh viên có điểm (grade) > 8.0.</li>

        const codeDiffs = {
            create: {
                sql: `cursor.execute(\n  "INSERT INTO users (name, email) VALUES (?, ?)",\n  ("Nam", "nam@example.com")\n)\nconn.commit()`,
                orm: `new_user = User(name="Nam", email="nam@example.com")\nsession.add(new_user)\nsession.commit()`
            },
            read: {
                sql: `cursor.execute("SELECT * FROM users WHERE name = ?", ("Nam",))\nuser = cursor.fetchone()`,
                orm: `user = session.query(User).filter_by(name="Nam").first()`
            },
            update: {
                sql: `cursor.execute(\n  "UPDATE users SET email = ? WHERE id = ?",\n  ("new@mail.com", 1)\n)\nconn.commit()`,
                orm: `user = session.get(User, 1)\nuser.email = "new@mail.com"\nsession.commit()`
            }
        };

        // --- APP LOGIC ---

        let currentChart = null;

        function loadModule(moduleId) {
            const mainContent = document.getElementById('main-content');
            const data = courseData[moduleId];
            
            // Update Active Nav State
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active', 'bg-blue-50', 'text-blue-600', 'border-right');
                el.classList.add('text-gray-600');
            });
            // Re-apply active style logic inside click handlers or here if we had ID refs
            
            // Inject Content
            mainContent.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="mb-6 fade-in">
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">${data.title}</h2>
                        <p class="text-gray-600 text-lg">${data.description}</p>
                    </div>
                    ${data.content}
                </div>
            `;

            // Initialize Charts if present
            if (data.chartId && data.chartData) {
                renderChart(data.chartId, data.chartType, data.chartData);
            }

            // Initialize specific view logic
            if (moduleId === 'practice') {
                showDiff('create'); // default view
            }

            // Mobile menu close
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function renderChart(id, type, data) {
            const ctx = document.getElementById(id).getContext('2d');
            if (currentChart) {
                currentChart.destroy();
            }
            currentChart = new Chart(ctx, {
                type: type,
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // --- INTERACTIVE FUNCTIONS ---

        // Day 2: Code Highlighter
        function highlight(part) {
            // Reset all
            document.querySelectorAll('[id^="v-"]').forEach(el => el.classList.remove('bg-yellow-200', 'ring-2', 'ring-yellow-400'));
            
            const explanation = document.getElementById('explanation-box');
            let targetId = '';
            let text = '';

            switch(part) {
                case 'import': text = "Nhập khẩu các thành phần cần thiết. 'Base' là lớp cha cho mọi model."; break;
                case 'base': text = "declarative_base() tạo ra một class cơ sở (Base). Mọi model của bạn phải kế thừa class này."; break;
                case 'class': text = "Class Python đại diện cho một thực thể."; targetId = 'v-tablename'; break;
                case 'tablename': text = "Thuộc tính bắt buộc __tablename__ định nghĩa tên bảng trong SQL."; targetId = 'v-tablename'; break;
                case 'id': text = "Khóa chính (Primary Key), kiểu số nguyên, tự động tăng."; targetId = 'v-id'; break;
                case 'name': text = "Cột tên, kiểu chuỗi ký tự, tối đa 50 ký tự."; targetId = 'v-name'; break;
                case 'email': text = "Cột email, yêu cầu giá trị phải là duy nhất (Unique)."; targetId = 'v-email'; break;
            }

            explanation.innerText = text;
            if (targetId) {
                const el = document.getElementById(targetId);
                el.classList.add('bg-yellow-200', 'ring-2', 'ring-yellow-400');
            }
        }

        // Day 4: Query Builder
        function updateQuery(type) {
            const pyOut = document.getElementById('py-output');
            const sqlOut = document.getElementById('sql-output');
            
            // Using explicit strings to avoid any parser ambiguity
            switch(type) {
                case 'all':
                    pyOut.innerText = 'session.query(User).all()';
                    sqlOut.innerText = 'SELECT * FROM users;';
                    break;
                case 'filter':
                    pyOut.innerText = "session.query(User).filter_by(name='An').all()";
                    sqlOut.innerText = "SELECT * FROM users WHERE users.name = 'An';";
                    break;
                case 'limit':
                    pyOut.innerText = 'session.query(User).order_by(User.name).limit(5).all()';
                    sqlOut.innerText = 'SELECT * FROM users ORDER BY users.name LIMIT 5;';
                    break;
            }
            
            // Animation effect
            pyOut.parentElement.classList.add('ring-2', 'ring-green-400');
            setTimeout(() => pyOut.parentElement.classList.remove('ring-2', 'ring-green-400'), 300);
        }

        // Day 6: Code Diff
        function showDiff(action) {
            document.getElementById('code-sql').innerText = codeDiffs[action].sql;
            document.getElementById('code-orm').innerText = codeDiffs[action].orm;

            // Update tab styles
            const tabs = document.querySelectorAll('.diff-tab');
            tabs.forEach(t => {
                t.classList.remove('border-blue-500', 'text-blue-600');
                t.classList.add('border-transparent', 'text-gray-500');
            });
            // Since this function is called by onclick, 'event' is available
            if (event && event.target) {
                 event.target.classList.remove('border-transparent', 'text-gray-500');
                 event.target.classList.add('border-blue-500', 'text-blue-600');
            }
        }

        // Init Mobile Menu
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadModule('intro'); // Default start
            
            // Add click handlers to sidebar buttons manually for styling update
            const navButtons = document.querySelectorAll('.nav-item');
            navButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    navButtons.forEach(b => {
                        b.classList.remove('active', 'bg-blue-50', 'text-blue-600', 'border-r-4', 'border-blue-600');
                        b.classList.add('text-gray-600');
                        b.querySelector('i').classList.remove('text-blue-500');
                        b.querySelector('i').classList.add('text-gray-400');
                    });
                    this.classList.add('active', 'bg-blue-50', 'text-blue-600', 'border-r-4', 'border-blue-600');
                    this.classList.remove('text-gray-600');
                    this.querySelector('i').classList.remove('text-gray-400');
                    this.querySelector('i').classList.add('text-blue-500');
                });
            });
            // Set first one active manually
            if(navButtons.length > 0) {
                // Manually apply active style to first button without triggering click (to avoid double loadModule)
                const firstBtn = navButtons[0];
                firstBtn.classList.add('active', 'bg-blue-50', 'text-blue-600', 'border-r-4', 'border-blue-600');
                firstBtn.classList.remove('text-gray-600');
                firstBtn.querySelector('i').classList.remove('text-gray-400');
                firstBtn.querySelector('i').classList.add('text-blue-500');
            }
        });

    </script>
