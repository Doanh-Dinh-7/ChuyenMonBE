         The app uses a 'Dashboard + Sidebar' layout common in LMS (Learning Management Systems).
         - Sidebar: Acts as the Week/Module navigation.
         - Main Area: Dynamic content rendering based on selected module.
         - Modules:
           1. Dashboard: Overview + Motivation (Charts).
           2. Module 1: Basics (Variables, Types).
           3. Module 2: Control Flow (Functions, Loops).
           4. Module 3: Data Structures (List, Tuple, Dict) - Includes comparison charts.
           5. Module 4: Files (I/O).
           6. Module 5: Practical Exercises (Interactive Problem Solving).
         - Logic: JS handles state (current module), renders content from a data object, and simulates code execution.
    -->

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 300px;
            max-height: 400px;
        }

        .syntax-s { color: #22c55e; } /* String */
        .syntax-f { color: #3b82f6; } /* Function */
        .syntax-c { color: #94a3b8; font-style: italic; } /* Comment */
        .syntax-n { color: #f59e0b; } /* Number */

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

</head>

        // --- State Management ---

            loadModule('dashboard');

            document.getElementById('menu-toggle').addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
                sidebar.classList.toggle('absolute');
                sidebar.classList.toggle('z-50');
                sidebar.classList.toggle('h-full');
            });

            // Adjust sidebar on resize
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('-translate-x-full', 'absolute', 'z-50');
                } else {
                    sidebar.classList.add('-translate-x-full', 'absolute', 'z-50');
                }
            });
            // Initial check
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full', 'absolute', 'z-50');
            }
        }

            navList.innerHTML = '';
            Object.values(courseData).forEach(mod => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <button onclick="loadModule('${mod.id}')" 
                        class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors ${currentModuleId === mod.id ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-300'}">
                        <span>${mod.icon}</span>
                        <span class="font-medium text-sm">${mod.title}</span>
                    </button>
                `;
                navList.appendChild(li);
            });
        }

        function updateProgress() {
            progress.add(currentModuleId);
            const percent = Math.round((progress.size / Object.keys(courseData).length) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.innerText = `${percent}%`;
        }

        function loadModule(id) {
            currentModuleId = id;
            renderNav();
            updateProgress();
            
            const mod = courseData[id];
            contentArea.innerHTML = ''; // Clear current

            // Header Section
            const header = document.createElement('div');
            header.className = "mb-8 fade-in";
            header.innerHTML = `
                <h2 class="text-3xl font-bold text-slate-800 mb-2">${mod.icon} ${mod.title}</h2>
                <div class="h-1 w-20 bg-blue-500 rounded"></div>
            `;
            contentArea.appendChild(header);

            // Dashboard Special Case
            if (id === 'dashboard') {
                const dashDiv = document.createElement('div');
                dashDiv.innerHTML = mod.content;
                contentArea.appendChild(dashDiv);
                initDashboardChart();
                return;
            }

            // Exercise Special Case
            if (mod.isExercise) {
                renderExercises(mod.exercises);
                return;
            }

            // Standard Module Content
            // 1. Introduction Paragraph (Context)
            const intro = document.createElement('p');
            intro.className = "text-slate-600 mb-8 max-w-3xl leading-relaxed fade-in";
            intro.innerHTML = `Trong phần này, chúng ta sẽ tìm hiểu về <strong>${mod.title}</strong>. Đây là kiến thức nền tảng giúp bạn xây dựng logic chương trình. Hãy đọc kỹ lý thuyết, xem ví dụ và thử chạy code ngay bên dưới.`;
            contentArea.appendChild(intro);

            // 2. Sections
            mod.sections.forEach((sec, index) => {
                const sectionDiv = document.createElement('section');
                sectionDiv.className = "mb-12 border-b border-slate-200 pb-8 last:border-0 fade-in";
                sectionDiv.style.animationDelay = `${index * 0.1}s`;

                let html = `
                    <h3 class="text-xl font-bold text-slate-700 mb-4">${sec.title}</h3>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Left: Theory & Context -->
                        <div class="space-y-6">
                            <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                                <h4 class="font-semibold text-blue-600 mb-2 uppercase text-xs tracking-wider">Lý thuyết</h4>
                                <p class="text-slate-600 leading-relaxed">${sec.theory}</p>
                                ${sec.types ? `
                                    <ul class="mt-4 space-y-2">
                                        ${sec.types.map(t => `
                                            <li class="flex items-start text-sm">
                                                <span class="font-mono text-pink-600 font-bold w-12 shrink-0">${t.name}</span>
                                                <span class="text-slate-600">${t.desc}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                ` : ''}
                            </div>
                            
                            ${sec.realWorld ? `
                                <div class="bg-indigo-50 p-4 rounded-lg border-l-4 border-indigo-500">
                                    <h4 class="font-bold text-indigo-700 text-sm mb-1">Ứng dụng thực tế</h4>
                                    <p class="text-indigo-800 text-sm">${sec.realWorld}</p>
                                </div>
                            ` : ''}

                            ${sec.warning ? `
                                <div class="bg-red-50 p-4 rounded-lg border-l-4 border-red-500">
                                    <h4 class="font-bold text-red-700 text-sm mb-1">⚠️ Lỗi thường gặp</h4>
                                    <p class="text-red-800 text-sm">${sec.warning}</p>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Right: Code & Output -->
                        <div class="flex flex-col">
                             ${sec.extraContent ? sec.extraContent : `
                                <div class="bg-slate-900 rounded-lg overflow-hidden shadow-lg flex flex-col h-full">
                                    <div class="bg-slate-800 px-4 py-2 flex justify-between items-center border-b border-slate-700">
                                        <span class="text-xs text-slate-400 font-mono">main.py</span>
                                        <div class="flex gap-1.5">
                                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                                        </div>
                                    </div>
                                    <div class="p-4 code-font text-sm text-slate-200 flex-1 overflow-auto whitespace-pre bg-slate-900 leading-6">${sec.code.trim()}</div>
                                    <div class="bg-slate-950 p-3 border-t border-slate-800">
                                        <button onclick="runCode(this, '${encodeURIComponent(sec.output)}')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded text-sm font-medium flex items-center gap-2 transition-colors">
                                            <span>▶</span> Chạy thử
                                        </button>
                                        <div class="output-area hidden mt-3 p-2 bg-black text-green-400 font-mono text-sm rounded border border-slate-800"></div>
                                    </div>
                                </div>
                             `}
                        </div>
                    </div>
                `;
                sectionDiv.innerHTML = html;
                contentArea.appendChild(sectionDiv);
            });

            // Init Chart if module has one
            if (mod.hasChart && id === 'module3') {
                setTimeout(initDataStructChart, 100);
            }
        }

        function renderExercises(exercises) {
            const intro = document.createElement('p');
            intro.className = "text-slate-600 mb-8 max-w-3xl leading-relaxed";
            intro.innerText = "Đây là 5 bài tập tổng hợp để kiểm tra kiến thức của bạn. Hãy tự viết code trước khi xem đáp án.";
            contentArea.appendChild(intro);

            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 gap-6 max-w-4xl";

            exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden fade-in";
                card.innerHTML = `
                    <div class="p-6">
                        <h3 class="font-bold text-lg text-slate-800 mb-2">${ex.title}</h3>
                        <p class="text-slate-600 mb-4">${ex.desc}</p>
                        <div class="bg-slate-100 p-3 rounded text-sm font-mono text-slate-700 mb-4">Input: ${ex.input}</div>
                        
                        <button onclick="toggleSolution('${ex.id}')" class="text-blue-600 font-medium text-sm hover:underline flex items-center gap-1">
                            <span>👁️</span> Xem/Ẩn Đáp Án
                        </button>
                        
                        <div id="sol-${ex.id}" class="hidden mt-4 pt-4 border-t border-slate-100">
                             <div class="bg-slate-900 p-4 rounded-lg text-sm code-font text-slate-200 overflow-x-auto">
                                ${ex.solution.trim()}
                             </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            contentArea.appendChild(grid);
        }

        // --- Interaction Logic ---

        function runCode(btn, outputText) {
            const outputDiv = btn.nextElementSibling;
            outputDiv.innerHTML = `<span class="opacity-50">Running...</span>`;
            outputDiv.classList.remove('hidden');
            
            setTimeout(() => {
                outputDiv.innerText = decodeURIComponent(outputText);
            }, 400); // Simulate processing delay
        }

        function toggleSolution(id) {
            const el = document.getElementById(`sol-${id}`);
            el.classList.toggle('hidden');
        }

        // --- Charts Implementation ---

        function initDashboardChart() {
            const ctx = document.getElementById('popularityChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Python', 'JavaScript', 'Java', 'C++', 'C#'],
                    datasets: [{
                        label: 'Mức độ phổ biến (%)',
                        data: [48, 32, 29, 22, 18],
                        backgroundColor: [
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(203, 213, 225, 0.5)',
                            'rgba(203, 213, 225, 0.5)',
                            'rgba(203, 213, 225, 0.5)',
                            'rgba(203, 213, 225, 0.5)'
                        ],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
                }
            });
        }

        function initDataStructChart() {
            const ctx = document.getElementById('dataStructChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Tốc độ đọc', 'Tốc độ ghi', 'Linh hoạt', 'Bộ nhớ', 'Unique (Duy nhất)'],
                    datasets: [{
                        label: 'List []',
                        data: [80, 90, 100, 60, 0],
                        borderColor: 'rgba(59, 130, 246, 1)',
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    }, {
                        label: 'Tuple ()',
                        data: [95, 0, 10, 90, 0], // Tuple không ghi được (Immutable)
                        borderColor: 'rgba(245, 158, 11, 1)',
                        backgroundColor: 'rgba(245, 158, 11, 0.2)',
                    }, {
                        label: 'Set {}',
                        data: [90, 80, 70, 50, 100],
                        borderColor: 'rgba(16, 185, 129, 1)',
                        backgroundColor: 'rgba(16, 185, 129, 0.2)',
                        hidden: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: '#e2e8f0' },
                            grid: { color: '#e2e8f0' },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    }
                }
            });
        }

        // Start App
        init();

    </script>
</body>
</html>
