        // Init App
        function init() {
            renderNav();
            loadChapter(0);
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.querySelector('aside').classList.toggle('hidden');
            });
        }

        function renderNav() {
            navContainer.innerHTML = courseData.map((chapter, index) => `
                <button onclick="loadChapter(${index})" 
                    class="w-full flex items-center p-3 rounded-lg text-left transition-colors ${index === currentChapter ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'text-gray-600 hover:bg-gray-100'}">
                    <span class="text-xl mr-3">${chapter.icon}</span>
                    <div>
                        <div class="text-sm font-semibold">${chapter.title}</div>
                        <div class="text-xs text-gray-400 truncate w-32">${chapter.subtitle}</div>
                    </div>
                </button>
            `).join('');
            
            // Update progress
            const pct = Math.round(((currentChapter + 1) / courseData.length) * 100);
            progressBar.style.width = `${pct}%`;
            progressText.innerText = `${pct}% Hoàn thành`;
        }

        function loadChapter(index) {
            currentChapter = index;
            renderNav();
            mainContent.innerHTML = courseData[index].content;
            
            // Post-load initializations
            if (index === 0) initChart();
            if (index === 2) updateConnectionCode();
            if (index === 3) showCrud('create'); // Default to create
            
            // Scroll to top
            mainContent.scrollTop = 0;
        }

        // --- Interactive Functions ---

        function initChart() {
            const ctx = document.getElementById('performanceChart');
            if(ctx) {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['10 Records', '1,000 Records', '100,000 Records'],
                        datasets: [
                            {
                                label: 'JSON File (Time)',
                                data: [0.1, 15, 1200], // Fake dramatic data
                                backgroundColor: '#9CA3AF',
                                borderRadius: 4
                            },
                            {
                                label: 'PostgreSQL (Time)',
                                data: [0.2, 0.5, 5], 
                                backgroundColor: '#4F46E5',
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: { callbacks: { label: (ctx) => `${ctx.raw}ms` } }
                        },
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'Time (ms)' } }
                        }
                    }
                });
            }
        }

        function setDbMode(mode) {
            dbMode = mode;
            // Update UI buttons
            const btnPg = document.getElementById('btn-pg');
            const btnMysql = document.getElementById('btn-mysql');
            
            if (mode === 'pg') {
                btnPg.className = "px-4 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-indigo-700 transition-all";
                btnMysql.className = "px-4 py-2 rounded-md text-sm font-bold text-gray-500 hover:text-indigo-700 transition-all";
            } else {
                btnMysql.className = "px-4 py-2 rounded-md text-sm font-bold bg-white shadow-sm text-indigo-700 transition-all";
                btnPg.className = "px-4 py-2 rounded-md text-sm font-bold text-gray-500 hover:text-indigo-700 transition-all";
            }

            // Update visible code blocks if they exist
            if (document.getElementById('connection-code')) updateConnectionCode();
            
            // If in CRUD section, re-render the current view to switch dialects
            const activeCrudBtn = document.querySelector('.crud-btn.active');
            if (activeCrudBtn) {
                 // Determine which operation is active based on button text
                 let op = 'create';
                 if (activeCrudBtn.innerText.includes('Read')) op = 'read';
                 if (activeCrudBtn.innerText.includes('Update')) op = 'update';
                 if (activeCrudBtn.innerText.includes('Delete')) op = 'delete';
                 showCrud(op);
            }
        }

        function updateConnectionCode() {
            const el = document.getElementById('connection-code');
            if(el) {
                const code = connectionSnippets[dbMode];
                el.innerHTML = highlightSyntax(code);
            }
        }

        function showCrud(operation) {
            // Update Tabs
            document.querySelectorAll('.crud-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'active');
                btn.classList.add('bg-white', 'text-gray-600');
                if (btn.innerText.toLowerCase().includes(operation)) {
                    btn.classList.add('bg-indigo-600', 'text-white', 'active');
                    btn.classList.remove('bg-white', 'text-gray-600');
                }
            });

            // Update Content
            const container = document.getElementById('crud-content');
            const snippet = crudSnippets[dbMode][operation];
            
            let explanation = "";
            if(operation === 'create') explanation = "Lấy dữ liệu JSON từ request, mở kết nối, thực thi INSERT, và <strong>commit</strong>.";
            if(operation === 'read') explanation = "Mở kết nối, thực thi SELECT, lấy dữ liệu bằng `fetchall()`, và trả về JSON.";
            if(operation === 'update') explanation = "Dùng ID trên URL để xác định User, dùng dữ liệu JSON để lấy thông tin mới. Đừng quên WHERE clause!";
            if(operation === 'delete') explanation = "Xóa dựa trên ID. Cẩn thận: Nếu thiếu WHERE sẽ xóa toàn bộ bảng!";

            container.innerHTML = `
                <div class="mb-4 text-sm text-gray-600 bg-blue-50 p-3 rounded border-l-4 border-blue-500">
                    <strong>Logic:</strong> ${explanation}
                </div>
                <div class="bg-gray-800 rounded-lg p-4 overflow-x-auto">
                    <pre class="code-font text-sm text-gray-300">${highlightSyntax(snippet)}</pre>
                </div>
            `;
        }

        // Simple Syntax Highlighter (Regex based)
        function highlightSyntax(code) {
            // Very basic highlighter for python-like syntax
            let html = code
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/#.*/g, match => `<span class="syntax-com">${match}</span>`)
                .replace(/('.*?')/g, match => `<span class="syntax-str">${match}</span>`)
                .replace(/(".*?")/g, match => `<span class="syntax-str">${match}</span>`)
                .replace(/\b(def|return|import|from|try|except|finally|if|else)\b/g, match => `<span class="syntax-kwd">${match}</span>`)
                .replace(/\b(print|jsonify|request|cursor|execute|commit|close|connect)\b/g, match => `<span class="syntax-func">${match}</span>`);
            return html;
        }

        // Start
        init();

    </script>
