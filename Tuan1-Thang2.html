<!DOCTYPE html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <!-- Chosen Palette: Slate (Dark Mode feel for code), Indigo (Primary), Emerald (Success), Amber (Warning) -->
    <!-- Application Structure Plan:
         1. Sidebar Navigation: Linear progression (Intro -> Install -> Structure -> Code -> Exercise).
         2. Main Content Area: Dynamic switching based on active module.
         3. Interactive Components:
            - Terminal Simulator: For installation commands.
            - File Tree Explorer: Clicking nodes updates a detail pane.
            - Comparison Chart: Radar chart to explain 'Why structure matters'.
            - Code Annotator: Hover/Click code lines to see explanations.
    -->
    <!-- Visualization & Content Choices:
         - Radar Chart: Compares 'Flat Structure' vs 'Package Structure' on attributes (Ease of Start, Scalability, Maintainability). Goal: Visualizing trade-offs.
         - File Tree (HTML/CSS): Represents folder structure. Goal: Familiarity with IDE layout.
         - Terminal (HTML/JS): Simulates command line. Goal: Muscle memory for setup.
         - No SVG/Mermaid: Using Unicode icons (📁, 📄, ⚡) and CSS styling.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Code Block Styling */
        .code-block {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .keyword { color: #c084fc; } /* purple */
        .string { color: #4ade80; } /* green */
        .func { color: #60a5fa; } /* blue */
        .comment { color: #64748b; font-style: italic; }

        /* Terminal Cursor Blink */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #4ade80;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Chart Container */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 400px;
            max-height: 400px;
        }
    </style>
</head>

        // --- Application Logic ---

        const app = {
            currentModuleIndex: 0,
            
            init() {
                this.renderNav();
                this.loadModule(modules[0].id);
                this.setupMobileMenu();
            },

            renderNav() {
                const list = document.getElementById('nav-list');
                const mobileList = document.getElementById('mobile-nav-list');
                list.innerHTML = '';
                mobileList.innerHTML = '';

                modules.forEach((mod, index) => {
                    // Desktop Nav
                    const li = document.createElement('li');
                    li.className = `cursor-pointer px-4 py-3 rounded-lg text-sm font-medium transition-colors flex items-center gap-3 text-slate-400 hover:bg-slate-700/50 hover:text-white mb-1 ${index === 0 ? 'bg-indigo-600/10 text-indigo-400' : ''}`;
                    li.innerHTML = `<span>${mod.icon}</span> ${mod.title}`;
                    li.onclick = () => this.loadModule(mod.id);
                    li.id = `nav-${mod.id}`;
                    list.appendChild(li);

                    // Mobile Nav
                    const mLi = document.createElement('li');
                    mLi.className = "cursor-pointer text-slate-300 hover:text-indigo-400";
                    mLi.innerText = mod.title;
                    mLi.onclick = () => {
                        this.loadModule(mod.id);
                        document.getElementById('mobile-menu').classList.add('hidden');
                    };
                    mobileList.appendChild(mLi);
                });
            },

            loadModule(moduleId) {
                const index = modules.findIndex(m => m.id === moduleId);
                this.currentModuleIndex = index;
                
                // Update UI
                document.getElementById('main-content').innerHTML = modules[index].content;
                this.updateNavActiveState(moduleId);
                this.updateProgress();

                // Initialize specific visuals
                if (moduleId === 'intro') setTimeout(() => this.initChart(), 100);
                if (moduleId === 'install') setTimeout(() => this.initTerminal(), 100);
            },

            updateNavActiveState(moduleId) {
                document.querySelectorAll('#nav-list li').forEach(li => {
                    li.classList.remove('bg-indigo-600/10', 'text-indigo-400', 'border-l-4', 'border-indigo-500');
                    li.classList.add('text-slate-400');
                });
                const active = document.getElementById(`nav-${moduleId}`);
                if (active) {
                    active.classList.remove('text-slate-400');
                    active.classList.add('bg-indigo-600/10', 'text-indigo-400');
                }
            },

            updateProgress() {
                const pct = Math.round(((this.currentModuleIndex + 1) / modules.length) * 100);
                document.getElementById('progress-bar').style.width = `${pct}%`;
                document.getElementById('progress-text').innerText = `${pct}%`;
            },

            setupMobileMenu() {
                const btn = document.getElementById('mobile-nav-btn');
                const menu = document.getElementById('mobile-menu');
                const close = document.getElementById('close-mobile-menu');

                btn.onclick = () => menu.classList.remove('hidden');
                close.onclick = () => menu.classList.add('hidden');
            },

            // --- Visualization specific logic ---

            initChart() {
                const ctx = document.getElementById('structureChart');
                if(!ctx) return;
                
                new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Dễ học', 'Tốc độ Code', 'Khả năng mở rộng', 'Bảo trì', 'Tách biệt code'],
                        datasets: [{
                            label: 'Cấu trúc Phẳng (Flat)',
                            data: [90, 95, 30, 40, 20],
                            fill: true,
                            backgroundColor: 'rgba(99, 102, 241, 0.2)',
                            borderColor: 'rgb(99, 102, 241)',
                            pointBackgroundColor: 'rgb(99, 102, 241)',
                        }, {
                            label: 'Cấu trúc Gói (Package)',
                            data: [50, 60, 90, 90, 95],
                            fill: true,
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            borderColor: 'rgb(16, 185, 129)',
                            pointBackgroundColor: 'rgb(16, 185, 129)',
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        scales: {
                            r: {
                                angleLines: { color: '#334155' },
                                grid: { color: '#334155' },
                                pointLabels: { color: '#94a3b8', font: { size: 12 } },
                                ticks: { display: false, backdropColor: 'transparent' }
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#cbd5e1' } }
                        }
                    }
                });
            },

            // Terminal Simulation
            initTerminal() {
                const input = document.getElementById('terminal-input');
                const history = document.getElementById('terminal-history');
                const feedback = document.getElementById('terminal-feedback');
                let step = 1;

                input.focus();
                
                // Focus trap logic
                document.getElementById('terminal-body').onclick = () => input.focus();

                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value.trim();
                        input.value = '';
                        
                        // Add to history
                        const line = document.createElement('div');
                        line.innerHTML = `<span class="text-emerald-400">➜ ~/my-project</span> <span class="text-slate-200">${cmd}</span>`;
                        history.appendChild(line);

                        // Simulate processing
                        if (step === 1 && (cmd === 'python -m venv venv' || cmd === 'python3 -m venv venv')) {
                            const res = document.createElement('div');
                            res.className = "text-slate-400 mb-2";
                            res.innerText = "Creating virtual environment...";
                            history.appendChild(res);
                            feedback.innerText = "Tốt lắm! Môi trường ảo đã được tạo.";
                            document.getElementById('step-2-card').classList.remove('opacity-50');
                            step = 2;
                        } else if (step === 2 && cmd === 'pip install flask') {
                             const res = document.createElement('div');
                            res.className = "text-slate-400 mb-2 whitespace-pre-line";
                            res.innerText = "Collecting flask\nDownloading flask-2.2.2-py3-none-any.whl (101 kB)\nInstalling collected packages: flask\nSuccessfully installed flask-2.2.2";
                            history.appendChild(res);
                            feedback.innerText = "Xuất sắc! Bạn đã cài xong Flask.";
                            feedback.classList.remove('text-amber-400');
                            feedback.classList.add('text-emerald-400', 'font-bold');
                            document.getElementById('btn-next-install').disabled = false;
                        } else {
                            const err = document.createElement('div');
                            err.className = "text-red-400 mb-2";
                            err.innerText = `Command not found or unexpected step: ${cmd}`;
                            history.appendChild(err);
                            feedback.innerText = step === 1 ? "Hãy gõ lệnh tạo venv trước." : "Hãy gõ lệnh cài đặt Flask.";

                        // Scroll to bottom
                        document.getElementById('terminal-body').scrollTop = document.getElementById('terminal-body').scrollHeight;
                    }
                });

                        icon: '📋'
                    },
                    'env': { 
                        title: '.env', 
                        subtitle: 'Biến môi trường', 
                        desc: 'Chứa thông tin nhạy cảm (API Keys, Database Password). <strong class="text-red-400">Tuyệt đối không</strong> commit file này lên Git.',
                        icon: '🔒'
                    }
                };

                const info = data[fileId];
                if(info) {
                    content.innerHTML = `
                         <div class="absolute top-4 right-4 text-6xl opacity-10 select-none">${info.icon}</div>
                        <h3 class="text-2xl font-bold text-emerald-400 mb-2">${info.title}</h3>
                        <p class="text-sm text-slate-400 mb-6 uppercase tracking-wider">${info.subtitle}</p>
                        <div class="space-y-4 text-slate-300 leading-relaxed">
                            <p>${info.desc}</p>
                        </div>
                    `;
                }
            },

            // Code Explanation
            showCodeExplain(lineId) {
                const title = document.getElementById('explain-title');
                const text = document.getElementById('explain-text');
                
                const explains = {
                    1: { t: 'Imports', d: 'Nhập class <code>Flask</code> để tạo app và hàm <code>jsonify</code> để chuyển đổi dữ liệu Dictionary sang JSON chuẩn.' },
                    2: { t: 'App Instance', d: '<code>__name__</code> là một biến đặc biệt của Python. Dòng này giúp Flask biết nó đang chạy ở đâu để tìm templates và static files.' },
                    3: { t: 'Route Decorator', d: '<code>@app.route</code> gắn một URL (ở đây là <code>/hello</code>) với hàm bên dưới. Khi người dùng truy cập URL này, hàm sẽ chạy.' },
                    4: { t: 'View Function', d: 'Hàm xử lý logic. Tên hàm nên đặt gợi nhớ (VD: get_users, create_post). Không nhất thiết phải trùng tên route.' },
                    5: { t: 'Return JSON', d: 'Trả về dữ liệu. <code>jsonify</code> tự động đặt Header <code>Content-Type: application/json</code>, giúp Frontend (React/Vue) hiểu đây là dữ liệu API.' },
                    6: { t: 'Entry Condition', d: 'Đảm bảo server chỉ chạy khi bạn chạy trực tiếp file này (<code>python app.py</code>), không chạy khi file này được import bởi file khác.' }
                };

                if(explains[lineId]) {
                    title.innerHTML = explains[lineId].t;
                    text.innerHTML = explains[lineId].d;
                    title.className = "text-xl font-bold text-emerald-400 mb-3";
                }
            },

            // Quiz Logic
            checkQuiz() {
                const input = document.getElementById('quiz-input').value.trim();
                const result = document.getElementById('quiz-result');
                
                if (input === 'jsonify') {
                    result.classList.remove('hidden');
                } else {
                    alert('Chưa đúng! Hãy nhớ lại hàm dùng để chuyển Dict sang JSON.');
                }
            },

            resetQuiz() {
                document.getElementById('quiz-result').classList.add('hidden');
                document.getElementById('quiz-input').value = '';
                document.getElementById('quiz-input').focus();

        window.onload = () => app.init();
