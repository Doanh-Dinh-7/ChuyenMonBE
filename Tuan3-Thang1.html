<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git & HTTP/REST API Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Chosen Palette: Slate (Backgrounds), Teal (Accents), Coral (Highlights) -->
    <!-- Application Structure Plan:
         - Layout: Sidebar navigation (Modules) + Main Content Area.
         - Theme: "Developer Environment" feel. Clean, slightly technical but accessible.
         - Modules:
            1. Overview: The big picture.
            2. Git Fundamentals: Interactive Terminal Simulator to teach add/commit.
            3. Git Branching & Remote: Visual CSS-based tree for branches.
            4. HTTP & REST API: Interactive Postman-like simulator for Request/Response cycle.
            5. Exercises: Practical checklist and mini-quiz.
         - Interactivity: 
            - 'Simulated Terminal' for Git commands.
            - 'API Sandbox' for testing HTTP methods.
            - Charts to visualize HTTP Status Codes and Git Usage.
    -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Chart Container */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 300px;
            max-height: 400px;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .slide-right { animation: slideRight 1s infinite; }
        @keyframes slideRight { 0% { transform: translateX(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(20px); opacity: 0; } }

        /* Git Node Visualization (CSS Only) */
        .git-node {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #0f172a;
            position: relative;
            z-index: 10;
        }
        .git-line {
            position: absolute;
            background-color: #cbd5e1;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-100 flex flex-col shadow-2xl flex-shrink-0 z-20 transition-transform duration-300 transform md:translate-x-0 -translate-x-full absolute md:relative h-full" id="sidebar">
        <div class="p-6 border-b border-slate-800 bg-slate-950">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-teal-500 flex items-center justify-center text-slate-900 font-bold"><i class="fa-solid fa-code-branch"></i></div>
                <div>
                    <h1 class="font-bold text-sm tracking-wider uppercase">Dev Protocol</h1>
                    <p class="text-xs text-slate-500">Git & HTTP/REST</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="nav-container">
            <!-- Nav Items generated by JS -->
        </nav>

        <div class="p-4 bg-slate-800 border-t border-slate-700 text-xs text-center text-slate-400">

            <div class="w-full bg-slate-700 h-1.5 rounded-full mt-2">

            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen relative w-full">
        <!-- Mobile Header -->
        <header class="md:hidden bg-white border-b border-slate-200 p-4 flex justify-between items-center z-10">
            <span class="font-bold text-slate-800">Dev Essentials</span>
            <button id="menu-btn" class="text-slate-600 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </header>

        <!-- Content Area -->
        <div id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth bg-slate-50">
            <!-- Content Injected Here -->
        </div>
    </main>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden md:hidden"></div>

    <!-- Visualization & Content Choices:
         - Git Simulation: Implemented a "Virtual Terminal" using HTML inputs and JS logic. Users type 'git add' or 'git commit' and visual blocks move between 'Working Dir', 'Staging', and 'Repo' columns.
         - HTTP Simulation: Created a "Request Builder" form. Users select method (GET/POST) and URL. JS simulates network delay and returns a formatted JSON response code block with appropriate status codes (200, 201, 404).
         - Charts: 
            1. HTTP Status Codes Distribution (Doughnut Chart): Visually groups 2xx, 4xx, 5xx codes.
            2. Git Workflow Frequency (Bar Chart): Shows which commands are used most often.
         - Diagrams: Using CSS absolute positioning to draw a simple Git branch tree (Main vs Feature branch) instead of SVG/Mermaid.
    -->

    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

            git_basics: {

                        content: `

                                        <li><code>git add login.py</code> -> File vào <em>Staging</em>.</li>

                    }
                ]
            },
            git_collab: {
                id: 'git_collab',
                title: 'GitHub & Branch',
                icon: 'fa-brands fa-github',
                sections: [
                    {
                        title: "1. Branching (Rẽ nhánh)",
                        theory: "Đừng code trực tiếp trên nhánh chính (main/master). Hãy tạo nhánh riêng (feature branch) để không làm hỏng code đang chạy.",
                        viz: 'branch_viz'
                    },
                    {
                        title: "2. GitHub Remote",
                        theory: "GitHub là nơi chứa code online (Remote). Lệnh `git push` đẩy code từ máy bạn lên GitHub. `git clone` lấy code về.",
                        content: `
                            <div class="bg-yellow-50 p-4 rounded border border-yellow-200 text-sm text-yellow-800 mb-4">
                                <i class="fa-solid fa-triangle-exclamation mr-2"></i>

                            </div>
                        `
                    }
                ]
            },
            http_rest: {
                id: 'http_rest',
                title: 'HTTP & API',
                icon: 'fa-solid fa-server',
                sections: [
                    {
                        title: "1. Request - Response Cycle",
                        theory: "Web hoạt động theo cơ chế hỏi-đáp. <strong>Client</strong> (Trình duyệt) gửi Request. <strong>Server</strong> xử lý và gửi lại Response.",
                        viz: 'http_cycle_viz'
                    },
                    {
                        title: "2. HTTP Methods (Verbs)",
                        theory: "Hành động bạn muốn làm với dữ liệu.",
                        content: `
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 text-center">
                                <div class="p-3 bg-blue-100 text-blue-800 rounded">
                                    <div class="font-bold text-lg">GET</div>

                                <div class="p-3 bg-green-100 text-green-800 rounded">

                                <div class="p-3 bg-orange-100 text-orange-800 rounded">

                    },
                    {
                        title: "3. API Simulator",
                        theory: "Thử nghiệm gửi request giả lập tới Server.",
                        interactive: 'api_sim'
                    },
                    {
                        title: "4. Status Codes",
                        theory: "Con số server trả về để báo kết quả.",
                        viz: 'chart_status_codes'
                    }
                ]
            },
            exercises: {
                id: 'exercises',
                title: 'Bài Tập',
                icon: 'fa-solid fa-pen-to-square',
                content: `
                    <div class="max-w-4xl mx-auto fade-in">
                        <h2 class="text-2xl font-bold text-slate-800 mb-6">Thực Hành Cuối Khóa</h2>
                        
                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">

                                <p class="text-sm text-slate-600 mb-4">Giả sử bạn làm ứng dụng Quản Lý Sinh Viên. Hãy viết ra các Endpoint cần thiết:</p>

                                            <tr><td class="py-2">Sửa thông tin SV</td><td class="font-mono text-orange-600">PUT</td><td class="font-mono">/api/students/:id</td></tr>
                                            <tr><td class="py-2">Xóa SV</td><td class="font-mono text-red-600">DELETE</td><td class="font-mono">/api/students/:id</td></tr>

        };

        // --- Core Application Logic ---
        let currentModuleId = 'overview';

        function init() {
            renderSidebar();
            loadModule('overview');
            setupMobileMenu();
        }

        function renderSidebar() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            
            Object.values(modules).forEach(mod => {
                const isActive = mod.id === currentModuleId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 flex items-center gap-3 transition-colors ${isActive ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
                btn.onclick = () => loadModule(mod.id);
                btn.innerHTML = `
                    <i class="${mod.icon} w-6 text-center"></i>
                    <span class="font-medium text-sm">${mod.title}</span>
                `;
                container.appendChild(btn);
            });
        }

        function loadModule(id) {
            currentModuleId = id;
            renderSidebar();
            updateProgress();
            
            const mod = modules[id];
            const contentDiv = document.getElementById('main-content');
            
            // Header
            let html = `
                <div class="mb-8 fade-in">
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                        <span class="text-teal-600"><i class="${mod.icon}"></i></span> ${mod.title}
                    </h2>
                    <div class="h-1 w-16 bg-teal-500 mt-2 rounded"></div>
                </div>
            `;

            // Simple Content Modules (Overview, Exercises)
            if (mod.content && !mod.sections) {
                html += mod.content;
                contentDiv.innerHTML = html;
                return;
            }

            // Structured Modules
            if (mod.sections) {
                mod.sections.forEach(sec => {
                    html += `
                        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8 fade-in">
                            <h3 class="text-lg font-bold text-slate-800 mb-4 border-l-4 border-slate-800 pl-3">${sec.title}</h3>
                            <p class="text-slate-600 mb-6 text-sm leading-relaxed">${sec.theory}</p>
                            
                            <!-- Interactive / Viz Container -->
                            ${sec.content ? sec.content : ''}
                            ${sec.interactive === 'git_sim' ? renderGitSimulator() : ''}
                            ${sec.interactive === 'api_sim' ? renderApiSimulator() : ''}
                            ${sec.viz === 'chart_git_stats' ? '<div class="chart-container"><canvas id="gitChart"></canvas></div>' : ''}
                            ${sec.viz === 'branch_viz' ? renderBranchViz() : ''}
                            ${sec.viz === 'http_cycle_viz' ? renderHttpCycleViz() : ''}
                            ${sec.viz === 'chart_status_codes' ? '<div class="chart-container"><canvas id="statusChart"></canvas></div>' : ''}
                        </section>
                    `;
                });
                contentDiv.innerHTML = html;
                
                // Initialize Visuals after DOM injection
                setTimeout(() => {
                    if (mod.sections.some(s => s.viz === 'chart_git_stats')) initGitChart();
                    if (mod.sections.some(s => s.viz === 'chart_status_codes')) initStatusChart();
                }, 100);
            }
        }

        function updateProgress() {
            const keys = Object.keys(modules);
            const idx = keys.indexOf(currentModuleId);
            const pct = Math.round(((idx + 1) / keys.length) * 100);
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function setupMobileMenu() {
            const btn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            const toggle = () => {
                const isClosed = sidebar.classList.contains('-translate-x-full');
                if (isClosed) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            };
            btn.onclick = toggle;
            overlay.onclick = toggle;
        }

        // --- Simulators & Visual Components ---

        function renderGitSimulator() {
            return `
                <div class="bg-slate-900 rounded-lg p-4 font-mono text-sm border border-slate-700 shadow-lg">
                    <div class="flex justify-between text-slate-400 mb-2 text-xs border-b border-slate-700 pb-2">
                        <span>Terminal Simulator</span>
                        <span>bash</span>
                    </div>
                    
                    <!-- Visual State -->
                    <div class="grid grid-cols-3 gap-2 mb-6 text-center text-xs">
                        <div class="bg-slate-800 p-2 rounded relative">
                            <div class="text-slate-400 mb-1">Working Dir</div>
                            <div id="file-wd" class="bg-red-500 text-white px-2 py-1 rounded inline-block transition-all duration-500">file.txt</div>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <div class="text-slate-400 mb-1">Staging Area</div>
                            <div id="file-stage" class="opacity-0 bg-green-500 text-white px-2 py-1 rounded inline-block transition-all duration-500 transform translate-y-4">file.txt</div>
                        </div>
                        <div class="bg-slate-800 p-2 rounded">
                            <div class="text-slate-400 mb-1">Repository</div>
                            <div id="file-repo" class="opacity-0 bg-blue-500 text-white px-2 py-1 rounded inline-block transition-all duration-500 transform translate-y-4">commit</div>
                        </div>
                    </div>

                    <!-- Input -->
                    <div class="flex items-center gap-2 text-slate-100">
                        <span class="text-green-400">user@dev:~$</span>
                        <input type="text" id="git-input" class="bg-transparent border-none outline-none flex-1 text-slate-100 placeholder-slate-600" placeholder="Type: git add . OR git commit" autocomplete="off" onkeydown="handleGitCommand(event)">
                    </div>
                    <div id="git-msg" class="text-slate-400 mt-2 h-5"></div>
                </div>
                <p class="text-xs text-slate-500 mt-2 text-center">Hãy gõ <code>git add .</code> rồi nhấn Enter, sau đó gõ <code>git commit</code>.</p>
            `;
        }

        function handleGitCommand(e) {
            if (e.key !== 'Enter') return;
            const cmd = e.target.value.trim();
            const msg = document.getElementById('git-msg');
            const fileWD = document.getElementById('file-wd');
            const fileStage = document.getElementById('file-stage');
            const fileRepo = document.getElementById('file-repo');

            e.target.value = '';

            if (cmd === 'git add .') {
                msg.innerText = 'Added file.txt to Staging Area.';
                msg.className = 'text-green-400 mt-2 h-5';
                fileWD.classList.add('opacity-50', 'scale-75');
                fileStage.classList.remove('opacity-0', 'translate-y-4');
            } else if (cmd.startsWith('git commit')) {
                if (fileStage.classList.contains('opacity-0')) {
                    msg.innerText = 'Error: Nothing to commit. Run "git add" first.';
                    msg.className = 'text-red-400 mt-2 h-5';
                    return;
                }
                msg.innerText = 'Committed changes to Repository.';
                msg.className = 'text-blue-400 mt-2 h-5';
                fileStage.classList.add('opacity-50', 'scale-75');
                fileRepo.classList.remove('opacity-0', 'translate-y-4');
            } else {
                msg.innerText = `Command not found: ${cmd}`;
                msg.className = 'text-red-400 mt-2 h-5';
            }
        }

        function renderBranchViz() {
            return `
                <div class="relative h-40 bg-slate-50 border border-slate-200 rounded-lg overflow-hidden flex items-center justify-center">
                    <!-- Main Branch Line -->
                    <div class="absolute h-1 w-3/4 bg-blue-300 top-1/2 -translate-y-1/2 left-10 rounded"></div>
                    <span class="absolute left-2 top-1/2 -translate-y-1/2 text-xs font-bold text-blue-600">Main</span>

                    <!-- Nodes Main -->
                    <div class="git-node absolute left-10 top-1/2 -translate-y-1/2 bg-blue-600" title="Init"></div>
                    <div class="git-node absolute left-32 top-1/2 -translate-y-1/2 bg-blue-600" title="Commit 1"></div>
                    <div class="git-node absolute left-80 top-1/2 -translate-y-1/2 bg-blue-600" title="Merge"></div>

                    <!-- Feature Branch Line -->
                    <div class="absolute h-1 w-40 bg-pink-300 top-10 left-32 rounded rotate-6 transform origin-bottom-left"></div>
                    <span class="absolute left-40 top-4 text-xs font-bold text-pink-600">Feature</span>

                    <!-- Nodes Feature -->
                    <div class="git-node absolute left-44 top-16 bg-pink-500" title="Feature Work"></div>
                    <div class="git-node absolute left-64 top-12 bg-pink-500" title="Feature Done"></div>
                    
                    <!-- Connector -->
                    <div class="absolute h-10 w-0.5 bg-slate-300 left-80 top-1/2 -translate-y-full transform -rotate-12 origin-bottom"></div>
                </div>
                <p class="text-xs text-center text-slate-500 mt-2">Sơ đồ minh họa: Nhánh Feature tách ra từ Main, phát triển riêng, rồi gộp (Merge) lại.</p>
            `;
        }

        function renderHttpCycleViz() {
            return `
                <div class="flex items-center justify-between bg-slate-50 p-6 rounded-lg border border-slate-200 relative">
                    <div class="text-center z-10">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl mx-auto border-4 border-white shadow-sm">
                            <i class="fa-solid fa-laptop"></i>
                        </div>
                        <div class="font-bold text-sm mt-2 text-slate-700">Client</div>
                    </div>

                    <div class="flex-1 h-1 bg-slate-200 mx-4 relative rounded">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-xs text-slate-400 bg-slate-50 px-2">Internet</div>
                        <i class="fa-solid fa-paper-plane text-teal-500 absolute top-1/2 -translate-y-1/2 text-lg slide-right"></i>
                    </div>

                    <div class="text-center z-10">
                        <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-2xl mx-auto border-4 border-white shadow-sm">
                            <i class="fa-solid fa-server"></i>
                        </div>
                        <div class="font-bold text-sm mt-2 text-slate-700">Server</div>
                    </div>
                </div>
            `;
        }

        function renderApiSimulator() {
            return `
                <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
                    <div class="bg-slate-100 p-3 flex gap-2 border-b border-slate-200">
                        <select id="api-method" class="bg-white border border-slate-300 text-slate-700 text-sm rounded focus:ring-teal-500 focus:border-teal-500 block p-2 font-bold">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                        <input type="text" disabled value="https://api.example.com/users/1" class="bg-slate-50 border border-slate-300 text-slate-500 text-sm rounded flex-1 p-2">
                        <button onclick="runApiSim()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded text-sm transition-colors">
                            Send
                        </button>
                    </div>
                    <div class="p-4 bg-slate-900 min-h-[150px] relative">
                        <div id="api-loading" class="hidden absolute inset-0 flex items-center justify-center bg-slate-900 bg-opacity-80">
                            <i class="fa-solid fa-circle-notch fa-spin text-teal-400 text-2xl"></i>
                        </div>
                        <pre id="api-response" class="font-mono text-xs text-green-400">Waiting for request...</pre>
                    </div>
                </div>
            `;
        }

        function runApiSim() {
            const method = document.getElementById('api-method').value;
            const loading = document.getElementById('api-loading');
            const output = document.getElementById('api-response');

            loading.classList.remove('hidden');
            output.innerText = '';

            setTimeout(() => {
                loading.classList.add('hidden');
                let res = {};
                if (method === 'GET') {
                    res = { status: 200, data: { id: 1, name: "Nguyen Van A", role: "Dev" } };
                } else if (method === 'POST') {
                    res = { status: 201, message: "User created successfully", id: 99 };
                } else if (method === 'DELETE') {
                    res = { status: 204, message: "No Content (Deleted)" };
                }
                output.innerText = JSON.stringify(res, null, 2);
            }, 800);
        }

        // --- Charts Initialization ---

        function initGitChart() {
            const ctx = document.getElementById('gitChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['status', 'add', 'commit', 'push', 'checkout', 'merge'],
                    datasets: [{
                        label: 'Tần suất sử dụng (%)',
                        data: [90, 85, 85, 60, 40, 20],
                        backgroundColor: 'rgba(20, 184, 166, 0.6)', // Teal
                        borderColor: 'rgba(20, 184, 166, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
                }
            });
        }

        function initStatusChart() {
            const ctx = document.getElementById('statusChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['2xx (Thành công)', '4xx (Lỗi Client)', '5xx (Lỗi Server)', '3xx (Chuyển hướng)'],
                    datasets: [{
                        data: [60, 30, 5, 5],
                        backgroundColor: [
                            '#22c55e', // Green
                            '#f59e0b', // Amber
                            '#ef4444', // Red
                            '#3b82f6'  // Blue
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }

        // Start
        init();

    </script>
</body>
